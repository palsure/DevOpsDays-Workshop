name: QoE Build Template

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      test_command:
        required: false
        type: string
        default: 'test'
      build_command:
        required: false
        type: string
        default: 'build'

jobs:
  build-and-test:
    name: Build and Test ${{ inputs.platform }}
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Run tests
        run: ${{ inputs.test_command }}
      
      - name: Build
        run: ${{ inputs.build_command }}
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.platform }}-artifacts
          path: |
            **/build/**
            **/dist/**
