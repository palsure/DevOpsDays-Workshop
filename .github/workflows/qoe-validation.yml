# Full-stack validation (parallel jobs). For an aggregate 80% pass-rate gate across platforms
# plus optional GitHub Release on main, see: build-acceptance-release.yml
name: QoE Validation

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qoe-api-tests:
    name: Backend API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Grant execute permission for gradlew
        run: chmod +x backend-api/gradlew
        working-directory: backend-api
      
      - name: Run API unit tests
        run: ./gradlew unitTest
        working-directory: backend-api
      
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: backend-api/build/test-results/unitTest

  qoe-web-tests:
    name: Web Player Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
        working-directory: web-player
      
      - name: Run tests
        run: npm test
        working-directory: web-player
      
      - name: Build
        run: npm run build
        working-directory: web-player

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web-player

      - name: End-to-end QoE gates
        run: npm run e2e
        working-directory: web-player

  qoe-android-tests:
    name: Android Player Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
      
      - name: Cache Gradle dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android-player/**/*.gradle*') }}
      
      - name: Run tests
        run: ./gradlew test
        working-directory: android-player

  qoe-test-framework:
    name: Test Automation Framework
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('framework/qoe-tests/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-
      
      - name: Run tests
        run: mvn test
        working-directory: framework/qoe-tests

  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [qoe-api-tests, qoe-web-tests, qoe-android-tests, qoe-test-framework]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "All QoE validation tests completed"
          echo "API Tests: ${{ needs.qoe-api-tests.result }}"
          echo "Web Tests: ${{ needs.qoe-web-tests.result }}"
          echo "Android Tests: ${{ needs.qoe-android-tests.result }}"
          echo "Test Framework: ${{ needs.qoe-test-framework.result }}"
      
      - name: Fail if any tests failed
        if: |
          needs.qoe-api-tests.result != 'success' ||
          needs.qoe-web-tests.result != 'success' ||
          needs.qoe-android-tests.result != 'success' ||
          needs.qoe-test-framework.result != 'success'
        run: |
          echo "One or more test suites failed"
          exit 1
