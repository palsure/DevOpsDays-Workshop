# QoE iOS Player Pipeline
#
# Stages (mirrors web pipeline structure):
#   0. notify-start  — post "build started" to Slack
#   1. unit-tests    — Swift Package unit tests (fast) → Slack thread reply
#   2. build-app     — Xcode simulator build (only when unit tests pass)
#   3. bat-e2e       — BAT Swift tests filtered by BATTests class → Slack reply
#   4. smoke-e2e     — Smoke tests filtered by SmokeTests class → Slack reply
#   5. regression-e2e — Regression tests (nightly / on-demand only)
#   6. quality-gate  — Gate: unit + BAT + Smoke must all pass
#   7a. publish-internal — Firebase App Distribution (internal testers)
#   7b. publish-public   — Firebase public testers (manual approval gate)
#   8. report        — Final summary + Slack overall result

name: Stream-QoE-App-iOS

on:
  pull_request:
    paths:
      - 'ios-player/**'
      - '.github/workflows/qoe-ios-tests.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'ios-player/**'
      - '.github/workflows/qoe-ios-tests.yml'
  schedule:
    # Nightly regression run at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests and force-publish to Firebase (hotfix mode)'
        required: false
        default: false
        type: boolean
      run_regression:
        description: 'Run Regression tests (in addition to BAT + Smoke)'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Target environment (STAGE / PROD)'
        required: false
        default: 'STAGE'

env:
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
  XCODE_VERSION: '15.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 0 — Notify Start
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  notify-start:
    name: Notify — build started
    runs-on: ubuntu-latest
    outputs:
      thread_ts:   ${{ steps.post.outputs.thread_ts }}
      start_epoch: ${{ steps.ts.outputs.start_epoch }}

    steps:
      - name: Record start time
        id: ts
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Post "build started" to Slack
        id: post
        if: env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(python3 - <<EOF
          import json
          blocks = [
            {"type": "header", "text": {"type": "plain_text", "text": "[iOS] Build — Started  |  Build #${{ github.run_number }}", "emoji": True}},
            {"type": "section", "fields": [
              {"type": "mrkdwn", "text": "*Branch:*\n\`${{ github.ref_name }}\`"},
              {"type": "mrkdwn", "text": "*Commit:*\n<$COMMIT_URL|${SHORT_SHA}>"},
              {"type": "mrkdwn", "text": "*Triggered by:*\n${{ github.actor }} (${{ github.event_name }})"},
            ]},
            {"type": "divider"},
            {"type": "context", "elements": [{"type": "mrkdwn", "text": "⏳ Swift unit tests running… BAT/Smoke results will follow in this thread."}]},
            {"type": "actions", "elements": [{"type": "button", "text": {"type": "plain_text", "text": "View Run", "emoji": True}, "url": "$RUN_URL", "style": "primary"}]}
          ]
          print(json.dumps({"channel": "${{ env.SLACK_CHANNEL_ID }}", "unfurl_links": False, "unfurl_media": False, "blocks": blocks}))
          EOF
          )

          RESPONSE=$(curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Slack response: $RESPONSE"
          TS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ts',''))")
          echo "thread_ts=$TS" >> "$GITHUB_OUTPUT"

      - name: Set empty thread_ts when Slack not configured
        if: env.SLACK_BOT_TOKEN == '' || env.SLACK_CHANNEL_ID == ''
        run: echo "thread_ts=" >> "$GITHUB_OUTPUT"

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — Unit Tests (entire Swift Package, all test classes)
# ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: "Stage 1 — Unit Tests (Swift Package)"
    runs-on: macos-latest
    needs: notify-start
    if: inputs.skip_tests != true

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ios-player/.build
          key: ${{ runner.os }}-swift-${{ hashFiles('ios-player/Package.swift', 'ios-player/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Build Swift Package
        run: swift build
        working-directory: ios-player

      - name: Run Swift Package unit tests
        id: unit
        run: swift test 2>&1 | tee swift-test.log
        working-directory: ios-player
        continue-on-error: true

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-unit-test-log
          path: ios-player/swift-test.log
          retention-days: 7

      - name: Post unit test result to Slack thread
        if: always()
        env:
          MODULE_NAME: iOS
          STAGE_NAME: Unit Tests (Swift)
          STAGE_RESULT: ${{ steps.unit.outcome }}
          REPORT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'EOF'
          import os, re, json
          from pathlib import Path

          log = Path("ios-player/swift-test.log").read_text(encoding="utf-8", errors="replace")
          passed = len(re.findall(r"Test Case '.*?' passed", log))
          failed  = len(re.findall(r"Test Case '.*?' failed", log))
          total   = passed + failed
          pct     = f"{int(100*passed/total)}%" if total else "0%"
          icon    = ":large_green_circle:" if failed == 0 and total > 0 else ":red_circle:" if failed > 0 else ":white_circle:"

          repo       = os.environ.get("GITHUB_REPOSITORY", "repo")
          run_id     = os.environ.get("GITHUB_RUN_ID", "")
          run_number = os.environ.get("GITHUB_RUN_NUMBER", "")
          sha_full   = os.environ.get("GITHUB_SHA", "unknown")
          sha        = sha_full[:7]
          thread_ts  = os.environ.get("THREAD_TS", "")
          report_url = os.environ.get("REPORT_URL", "")
          verdict    = "PASSED" if failed == 0 and total > 0 else "FAILED" if failed > 0 else os.environ.get("STAGE_RESULT","UNKNOWN").upper()
          run_url    = f"https://github.com/{repo}/actions/runs/{run_id}" if run_id else f"https://github.com/{repo}"
          commit_url = f"https://github.com/{repo}/commit/{sha_full}"
          build_label = f"Build #{run_number}" if run_number else f"Run {run_id}"

          if total > 0:
              stats = f"{icon}  *Passed:* {passed}  |  *Failed:* {failed}  |  *Total:* {total}  |  *Pass Rate:* {pct}"
          else:
              r = os.environ.get("STAGE_RESULT","unknown")
              icon2 = ":large_green_circle:" if r == "success" else ":red_circle:"
              stats = f"{icon2}  *Result:* {verdict}"

          footer_parts = [f"<{commit_url}|{sha}>  •  {build_label}"]
          if report_url:
              footer_parts.append(f"<{report_url}|:bar_chart: View Report>")
          footer_parts.append(f"<{run_url}|:arrow_forward: View Run>")

          payload = {
              "unfurl_links": False, "unfurl_media": False,
              "blocks": [
                  {"type": "header", "text": {"type": "plain_text", "text": f"[iOS] Unit Tests (Swift) — {verdict}  |  {build_label}", "emoji": True}},
                  {"type": "section", "text": {"type": "mrkdwn", "text": stats}},
                  {"type": "context", "elements": [{"type": "mrkdwn", "text": "    ".join(footer_parts)}]},
              ]
          }
          if thread_ts:
              payload["thread_ts"] = thread_ts
          Path("stage-slack-payload.json").write_text(json.dumps(payload, indent=2))
          print("Wrote stage-slack-payload.json")
          EOF

      - name: Send unit test Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

      - name: Fail if unit tests failed
        if: steps.unit.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — Build Xcode App (simulator)
# ─────────────────────────────────────────────────────────────────────────────
  build-app:
    name: "Stage 2 — Build Xcode App (Simulator)"
    runs-on: macos-latest
    needs: [notify-start, unit-tests]
    if: always() && needs.notify-start.result == 'success' && needs.unit-tests.result != 'failure'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ios-player/.build
          key: ${{ runner.os }}-swift-${{ hashFiles('ios-player/Package.swift', 'ios-player/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Build Xcode app (iPhone 15 simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project QoePlayerApp.xcodeproj \
            -scheme QoePlayerApp \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            clean build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty
        working-directory: ios-player

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — BAT (Swift Package tests — BATTests class)
# ─────────────────────────────────────────────────────────────────────────────
  bat-e2e:
    name: "Stage 3 — BAT (Swift Package)"
    runs-on: macos-latest
    needs: [notify-start, build-app]
    if: inputs.skip_tests != true && needs.build-app.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ios-player/.build
          key: ${{ runner.os }}-swift-${{ hashFiles('ios-player/Package.swift', 'ios-player/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Run BAT tests
        id: bat
        run: swift test --filter BATTests 2>&1 | tee bat-test.log
        working-directory: ios-player
        continue-on-error: true

      - name: Upload BAT test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-bat-test-log
          path: ios-player/bat-test.log
          retention-days: 7

      - name: Post BAT result to Slack thread
        if: always()
        env:
          MODULE_NAME: iOS
          STAGE_NAME: BAT (Swift)
          STAGE_RESULT: ${{ steps.bat.outcome }}
          REPORT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'EOF'
          import os, re, json
          from pathlib import Path

          log = Path("ios-player/bat-test.log").read_text(encoding="utf-8", errors="replace")
          passed = len(re.findall(r"Test Case '.*?' passed", log))
          failed  = len(re.findall(r"Test Case '.*?' failed", log))
          total   = passed + failed
          icon    = ":large_green_circle:" if failed == 0 and total > 0 else ":red_circle:" if failed > 0 else ":white_circle:"
          verdict = "PASSED" if failed == 0 and total > 0 else "FAILED" if failed > 0 else os.environ.get("STAGE_RESULT","UNKNOWN").upper()
          run_number = os.environ.get("GITHUB_RUN_NUMBER","")
          build_label = f"Build #{run_number}"
          stats = f"{icon}  *Passed:* {passed}  |  *Failed:* {failed}  |  *Total:* {total}" if total else f"{icon}  *Result:* {verdict}"
          thread_ts = os.environ.get("THREAD_TS","")

          payload = {
              "unfurl_links": False, "unfurl_media": False,
              "blocks": [
                  {"type": "header", "text": {"type": "plain_text", "text": f"[iOS] BAT (Swift) — {verdict}  |  {build_label}", "emoji": True}},
                  {"type": "section", "text": {"type": "mrkdwn", "text": stats}},
              ]
          }
          if thread_ts:
              payload["thread_ts"] = thread_ts
          Path("stage-slack-payload.json").write_text(json.dumps(payload, indent=2))
          EOF

      - name: Send BAT Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

      - name: Fail if BAT tests failed
        if: steps.bat.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4 — Smoke (SmokeTests class — runs after BAT passes)
# ─────────────────────────────────────────────────────────────────────────────
  smoke-e2e:
    name: "Stage 4 — Smoke (Swift Package)"
    runs-on: macos-latest
    needs: [notify-start, build-app, bat-e2e]
    if: inputs.skip_tests != true && needs.bat-e2e.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ios-player/.build
          key: ${{ runner.os }}-swift-${{ hashFiles('ios-player/Package.swift', 'ios-player/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Run Smoke tests
        id: smoke
        run: swift test --filter SmokeTests 2>&1 | tee smoke-test.log
        working-directory: ios-player
        continue-on-error: true

      - name: Upload Smoke test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-smoke-test-log
          path: ios-player/smoke-test.log
          retention-days: 7

      - name: Post Smoke result to Slack thread
        if: always()
        env:
          MODULE_NAME: iOS
          STAGE_NAME: Smoke (Swift)
          STAGE_RESULT: ${{ steps.smoke.outcome }}
          REPORT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'EOF'
          import os, re, json
          from pathlib import Path

          log = Path("ios-player/smoke-test.log").read_text(encoding="utf-8", errors="replace")
          passed = len(re.findall(r"Test Case '.*?' passed", log))
          failed  = len(re.findall(r"Test Case '.*?' failed", log))
          total   = passed + failed
          icon    = ":large_green_circle:" if failed == 0 and total > 0 else ":red_circle:" if failed > 0 else ":white_circle:"
          verdict = "PASSED" if failed == 0 and total > 0 else "FAILED" if failed > 0 else os.environ.get("STAGE_RESULT","UNKNOWN").upper()
          run_number = os.environ.get("GITHUB_RUN_NUMBER","")
          build_label = f"Build #{run_number}"
          stats = f"{icon}  *Passed:* {passed}  |  *Failed:* {failed}  |  *Total:* {total}" if total else f"{icon}  *Result:* {verdict}"
          thread_ts = os.environ.get("THREAD_TS","")

          payload = {
              "unfurl_links": False, "unfurl_media": False,
              "blocks": [
                  {"type": "header", "text": {"type": "plain_text", "text": f"[iOS] Smoke (Swift) — {verdict}  |  {build_label}", "emoji": True}},
                  {"type": "section", "text": {"type": "mrkdwn", "text": stats}},
              ]
          }
          if thread_ts:
              payload["thread_ts"] = thread_ts
          Path("stage-slack-payload.json").write_text(json.dumps(payload, indent=2))
          EOF

      - name: Send Smoke Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

      - name: Fail if Smoke tests failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 5 — Regression (nightly or manual trigger)
# ─────────────────────────────────────────────────────────────────────────────
  regression-e2e:
    name: "Stage 5 — Regression (Swift Package)"
    runs-on: macos-latest
    needs: [notify-start, build-app, smoke-e2e]
    if: >
      inputs.skip_tests != true &&
      needs.smoke-e2e.result == 'success' &&
      (github.event_name == 'schedule' || inputs.run_regression == true)

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -switch /Applications/Xcode_${{ env.XCODE_VERSION }}.app

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            ios-player/.build
          key: ${{ runner.os }}-swift-${{ hashFiles('ios-player/Package.swift', 'ios-player/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Run Regression tests
        id: regression
        run: swift test --filter RegressionTests 2>&1 | tee regression-test.log
        working-directory: ios-player
        continue-on-error: true

      - name: Upload Regression test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-regression-test-log
          path: ios-player/regression-test.log
          retention-days: 14

      - name: Post Regression result to Slack thread
        if: always()
        env:
          MODULE_NAME: iOS
          STAGE_NAME: Regression (Swift)
          STAGE_RESULT: ${{ steps.regression.outcome }}
          REPORT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'EOF'
          import os, re, json
          from pathlib import Path

          log = Path("ios-player/regression-test.log").read_text(encoding="utf-8", errors="replace")
          passed = len(re.findall(r"Test Case '.*?' passed", log))
          failed  = len(re.findall(r"Test Case '.*?' failed", log))
          total   = passed + failed
          icon    = ":large_green_circle:" if failed == 0 and total > 0 else ":red_circle:" if failed > 0 else ":white_circle:"
          verdict = "PASSED" if failed == 0 and total > 0 else "FAILED" if failed > 0 else os.environ.get("STAGE_RESULT","UNKNOWN").upper()
          run_number = os.environ.get("GITHUB_RUN_NUMBER","")
          build_label = f"Build #{run_number}"
          stats = f"{icon}  *Passed:* {passed}  |  *Failed:* {failed}  |  *Total:* {total}" if total else f"{icon}  *Result:* {verdict}"
          thread_ts = os.environ.get("THREAD_TS","")

          payload = {
              "unfurl_links": False, "unfurl_media": False,
              "blocks": [
                  {"type": "header", "text": {"type": "plain_text", "text": f"[iOS] Regression (Swift) — {verdict}  |  {build_label}", "emoji": True}},
                  {"type": "section", "text": {"type": "mrkdwn", "text": stats}},
              ]
          }
          if thread_ts:
              payload["thread_ts"] = thread_ts
          Path("stage-slack-payload.json").write_text(json.dumps(payload, indent=2))
          EOF

      - name: Send Regression Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 6 — Quality Gate
# Passes when: unit + BAT + Smoke succeed (or skip_tests=true).
# ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: "Stage 6 — Quality Gate"
    runs-on: ubuntu-latest
    needs: [notify-start, unit-tests, build-app, bat-e2e, smoke-e2e]
    if: always() && needs.build-app.result == 'success'
    outputs:
      passed: ${{ steps.check.outputs.passed }}

    steps:
      - id: check
        name: Evaluate quality gate
        run: |
          SKIP="${{ inputs.skip_tests }}"
          UNIT="${{ needs.unit-tests.result }}"
          BAT="${{ needs.bat-e2e.result }}"
          SMOKE="${{ needs.smoke-e2e.result }}"

          if [ "$SKIP" = "true" ]; then
            echo "⚡ Force-publish mode — tests skipped, gate bypassed"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          elif [ "$UNIT" = "success" ] && [ "$BAT" = "success" ] && [ "$SMOKE" = "success" ]; then
            echo "✅ Quality gate PASSED (unit=$UNIT, bat=$BAT, smoke=$SMOKE)"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Quality gate FAILED (unit=$UNIT, bat=$BAT, smoke=$SMOKE)"
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 7a — Firebase internal testers
# ─────────────────────────────────────────────────────────────────────────────
  publish-internal:
    name: "Stage 7a — Publish to Internal Testers"
    runs-on: ubuntu-latest
    needs: [notify-start, build-app, quality-gate]
    if: always() && needs.quality-gate.outputs.passed == 'true' && needs.build-app.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Distribute to Firebase — internal-testers
        id: firebase_internal
        if: env.FIREBASE_APP_ID_IOS != '' && env.FIREBASE_CREDENTIAL_FILE_CONTENT != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_IOS }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          groups: internal-testers
          releaseNotes: |
            [INTERNAL] Build #${{ github.run_number }} — ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Status: Pending public release approval — smoke test before approving.
        env:
          FIREBASE_APP_ID_IOS: ${{ secrets.FIREBASE_APP_ID_IOS }}
          FIREBASE_CREDENTIAL_FILE_CONTENT: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}

      - name: Post internal publish result to Slack thread
        if: always()
        env:
          MODULE_NAME: iOS
          STAGE_NAME: "Firebase Internal Testers"
          STAGE_RESULT: ${{ steps.firebase_internal.outcome || 'skipped' }}
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send internal publish Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 7b — Firebase public testers (manual approval required)
# ─────────────────────────────────────────────────────────────────────────────
  publish-public:
    name: "Stage 7b — Publish to Public Testers"
    runs-on: ubuntu-latest
    environment: firebase-production
    needs: [notify-start, build-app, quality-gate, publish-internal]
    if: always() && needs.quality-gate.outputs.passed == 'true' && needs.publish-internal.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Distribute to Firebase — public-testers
        id: firebase_public
        if: env.FIREBASE_APP_ID_IOS != '' && env.FIREBASE_CREDENTIAL_FILE_CONTENT != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_IOS }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          groups: public-testers
          releaseNotes: |
            Build #${{ github.run_number }} — ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            ✅ Approved after internal smoke testing.
        env:
          FIREBASE_APP_ID_IOS: ${{ secrets.FIREBASE_APP_ID_IOS }}
          FIREBASE_CREDENTIAL_FILE_CONTENT: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}

      - name: Post public publish result to Slack thread
        if: always()
        env:
          MODULE_NAME: iOS
          STAGE_NAME: "Firebase Public Testers"
          STAGE_RESULT: ${{ steps.firebase_public.outcome || 'skipped' }}
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send public publish Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 8 — Final summary + Slack overall result
# ─────────────────────────────────────────────────────────────────────────────
  report:
    name: "Stage 8 — Report & Slack"
    runs-on: ubuntu-latest
    needs:
      - notify-start
      - unit-tests
      - build-app
      - bat-e2e
      - smoke-e2e
      - regression-e2e
      - quality-gate
      - publish-internal
      - publish-public
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Pipeline summary
        run: |
          echo "## iOS Player Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests (Swift Package) | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Xcode App | ${{ needs.build-app.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| BAT (Swift Package) | ${{ needs.bat-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke (Swift Package) | ${{ needs.smoke-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression (Swift Package) | ${{ needs.regression-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Gate | ${{ needs.quality-gate.result }} (${{ needs.quality-gate.outputs.passed }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase Internal | ${{ needs.publish-internal.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase Public   | ${{ needs.publish-public.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`  |  **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Build Slack result payload
        if: always()
        env:
          MODULE_NAME: iOS
          STAGE1_NAME: Unit Tests (Swift)
          STAGE1_RESULT: ${{ needs.unit-tests.result }}
          STAGE2_NAME: Build Xcode App
          STAGE2_RESULT: ${{ needs.build-app.result }}
          STAGE3_NAME: BAT (Swift)
          STAGE3_RESULT: ${{ needs.bat-e2e.result }}
          STAGE4_NAME: Smoke (Swift)
          STAGE4_RESULT: ${{ needs.smoke-e2e.result }}
          STAGE5_NAME: Firebase Public
          STAGE5_RESULT: ${{ needs.publish-public.result }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          WORKFLOW_START_EPOCH: ${{ needs.notify-start.outputs.start_epoch }}
        run: python3 .github/scripts/module_result_to_slack.py

      - name: Inject thread_ts into Slack payload
        if: always() && needs.notify-start.outputs.thread_ts != ''
        run: |
          python3 - <<'EOF'
          import json, pathlib
          ts = "${{ needs.notify-start.outputs.thread_ts }}"
          p = json.loads(pathlib.Path("module-slack-payload.json").read_text())
          p["thread_ts"] = ts
          pathlib.Path("module-slack-payload.json").write_text(json.dumps(p))
          EOF

      - name: Send Slack result notification
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./module-slack-payload.json

      - name: Fail pipeline if any critical stage failed
        if: |
          needs.unit-tests.result == 'failure' ||
          needs.build-app.result == 'failure' ||
          needs.bat-e2e.result == 'failure' ||
          needs.smoke-e2e.result == 'failure'
        run: exit 1
