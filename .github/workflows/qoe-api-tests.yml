# QoE API Tests
#
# Flow:
#   0. notify-start   — posts "build started" to Slack; captures message ts for threading.
#   1. unit-tests     — runs @Tag("unit") tests (Mockito, no DB) BEFORE any deploy.
#                       Result posted as a thread reply to the start message.
#   2. e2e-tests      — matrix across all supported platforms; one job per platform.
#                       Each job runs @Tag("e2e") REST-Assured tests against an
#                       embedded Spring Boot server + Testcontainers Postgres.
#   3. api-report     — collects all platform summaries, generates Allure, posts the
#                       per-platform table as a thread reply to the start message.
#
# Required secrets (Slack is optional — all Slack steps are skipped if not set):
#   SLACK_BOT_TOKEN   — Slack bot OAuth token
#   SLACK_CHANNEL_ID  — target channel ID

name: QoE API Tests

on:
  pull_request:
    paths:
      - 'backend-api/**'
      - '.github/workflows/qoe-api-tests.yml'
      - '.github/scripts/api_tests_to_slack.py'
  push:
    branches: [main, develop]
    paths:
      - 'backend-api/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment label (STAGE / PROD)'
        required: false
        default: 'STAGE'

env:
  QUALITY_GATE_THRESHOLD: '80'
  ENV_LABEL: ${{ github.event.inputs.environment || 'STAGE' }}

# ─────────────────────────────────────────────────────────────────────────────
# 0. NOTIFY START  — post initial Slack message, capture thread ts
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  notify-start:
    name: Notify — build started
    runs-on: ubuntu-latest
    outputs:
      thread_ts: ${{ steps.post.outputs.thread_ts }}

    steps:
      - name: Post "build started" to Slack
        id: post
        if: ${{ secrets.SLACK_BOT_TOKEN != '' && secrets.SLACK_CHANNEL_ID != '' }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ACTOR="${{ github.actor }}"
          REF="${{ github.ref_name }}"
          EVENT="${{ github.event_name }}"
          ENV_LABEL="${{ env.ENV_LABEL }}"

          PAYLOAD=$(python3 - <<EOF
          import json
          blocks = [
            {
              "type": "header",
              "text": {"type": "plain_text", "text": "🚀 QoE API Pipeline — Started", "emoji": True}
            },
            {
              "type": "section",
              "fields": [
                {"type": "mrkdwn", "text": f"*Branch:*\n\`{REF}\`"},
                {"type": "mrkdwn", "text": f"*Environment:*\n{ENV_LABEL}"},
                {"type": "mrkdwn", "text": f"*Commit:*\n\`{SHORT_SHA}\`"},
                {"type": "mrkdwn", "text": f"*Triggered by:*\n{ACTOR} ({EVENT})"},
              ]
            },
            {"type": "divider"},
            {
              "type": "context",
              "elements": [
                {"type": "mrkdwn", "text": "⏳ Unit tests running… E2E results will follow in this thread."}
              ]
            },
            {
              "type": "actions",
              "elements": [
                {
                  "type": "button",
                  "text": {"type": "plain_text", "text": "View Run", "emoji": True},
                  "url": "$RUN_URL",
                  "style": "primary"
                }
              ]
            }
          ]
          print(json.dumps({"channel": "$SLACK_CHANNEL_ID", "blocks": blocks}))
          EOF
          )

          RESPONSE=$(curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer $SLACK_BOT_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Slack response: $RESPONSE"
          TS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ts',''))")
          echo "thread_ts=$TS" >> "$GITHUB_OUTPUT"

      - name: Set empty thread_ts when Slack not configured
        if: ${{ secrets.SLACK_BOT_TOKEN == '' || secrets.SLACK_CHANNEL_ID == '' }}
        run: echo "thread_ts=" >> "$GITHUB_OUTPUT"

# ─────────────────────────────────────────────────────────────────────────────
# 1. UNIT TESTS  (pre-deploy gate, no DB required)
# ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (pre-deploy)
    runs-on: ubuntu-latest
    needs: notify-start

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend-api/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run unit tests
        id: unit
        run: ./gradlew unitTest --no-daemon
        working-directory: backend-api

      - name: Upload unit test results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backend-api/build/test-results/unitTest

      - name: Upload unit HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-html-report
          path: backend-api/build/reports/tests/unitTest

      - name: Build unit test Slack payload
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          QUALITY_GATE_THRESHOLD: ${{ env.QUALITY_GATE_THRESHOLD }}
        run: |
          python3 - <<'EOF'
          import glob, json, xml.etree.ElementTree as ET, os, pathlib

          files = glob.glob("backend-api/build/test-results/unitTest/TEST-*.xml")
          total=passed=failed=skipped=0
          for f in files:
              root = ET.parse(f).getroot()
              t = int(root.attrib.get("tests",0))
              fa = int(root.attrib.get("failures",0)) + int(root.attrib.get("errors",0))
              s = int(root.attrib.get("skipped",0))
              total+=t; failed+=fa; skipped+=s; passed+=max(0,t-fa-s)

          repo = os.environ.get("GITHUB_REPOSITORY","repo")
          run_id = os.environ.get("GITHUB_RUN_ID","")
          allure_url = f"https://github.com/{repo}/actions/runs/{run_id}#artifacts"

          report = {
            "env":      os.environ.get("ENV_LABEL","STAGE"),
            "testType": "unit",
            "stage":    "pre-deploy",
            "branch":   os.environ.get("GITHUB_REF_NAME","unknown"),
            "platforms": [{"platform":"all-unit","passed":passed,"failed":failed,
                           "skipped":skipped,"total":total,"allureUrl":allure_url}]
          }
          pathlib.Path("api-test-report.json").write_text(json.dumps(report,indent=2))
          EOF

          python3 .github/scripts/api_tests_to_slack.py api-test-report.json

      - name: Inject thread_ts into unit test payload
        if: always() && needs.notify-start.outputs.thread_ts != ''
        run: |
          python3 - <<'EOF'
          import json, pathlib
          ts = "${{ needs.notify-start.outputs.thread_ts }}"
          p = json.loads(pathlib.Path("api-slack-payload.json").read_text())
          p["thread_ts"] = ts
          pathlib.Path("api-slack-payload.json").write_text(json.dumps(p))
          EOF

      - name: Post unit test result as Slack thread reply
        if: always() && secrets.SLACK_BOT_TOKEN != '' && secrets.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./api-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# 2. E2E TESTS  (per-platform matrix, post-deploy / Testcontainers)
# ─────────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: E2E — ${{ matrix.platform }}
    needs: [notify-start, unit-tests]
    runs-on: ubuntu-latest
    if: always() && needs.unit-tests.result != 'cancelled'

    strategy:
      fail-fast: false
      matrix:
        platform:
          - web
          - iphone
          - ipad
          - androidphone
          - androidtablet
          - appletv
          - androidtv
          - firetv
          - samsungtv
          - lgtv
          - roku
          - chromecast
          - xbox
          - playstation
          - desktop_macos
          - desktop_windows
          - desktop_linux

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: qoe_user
          POSTGRES_PASSWORD: qoe_password
          POSTGRES_DB: qoe_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend-api/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run E2E tests (platform=${{ matrix.platform }})
        id: e2e
        continue-on-error: true
        run: ./gradlew e2eTest --no-daemon
        working-directory: backend-api
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/qoe_db
          SPRING_DATASOURCE_USERNAME: qoe_user
          SPRING_DATASOURCE_PASSWORD: qoe_password
          QOE_TEST_PLATFORM: ${{ matrix.platform }}

      - name: Build platform summary JSON
        if: always()
        run: |
          python3 .github/scripts/junit_to_summary.py "${{ matrix.platform }}" \
            backend-api/build/test-results/e2eTest \
            || echo '{"platform":"${{ matrix.platform }}","passed":0,"failed":1,"skipped":0,"total":1}' \
               > platform-summary.json

      - name: Upload XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.platform }}
          path: backend-api/build/test-results/e2eTest

      - name: Upload Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.platform }}
          path: backend-api/build/allure-results

      - name: Upload platform summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-summary-${{ matrix.platform }}
          path: platform-summary.json

# ─────────────────────────────────────────────────────────────────────────────
# 3. REPORT + SLACK  (aggregates all platforms, posts table as thread reply)
# ─────────────────────────────────────────────────────────────────────────────
  api-report:
    name: API Report & Slack notification
    needs: [notify-start, e2e-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: platform-summary-*
          path: platform-summaries
          merge-multiple: false

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: allure-results-all
          merge-multiple: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend-api/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d allure-results-all ] && [ "$(ls -A allure-results-all 2>/dev/null)" ]; then
            gradle downloadAllure --no-daemon -p backend-api
            backend-api/build/allure/commandline/bin/allure generate allure-results-all \
              --clean -o allure-report
          else
            echo "No Allure results found, skipping report generation"
            mkdir -p allure-report
          fi

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-combined
          path: allure-report

      - name: Assemble E2E report JSON
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          ENV_LABEL: ${{ env.ENV_LABEL }}
        run: |
          python3 - <<'EOF'
          import glob, json, os, pathlib

          repo   = os.environ.get("GITHUB_REPOSITORY","repo")
          run_id = os.environ.get("GITHUB_RUN_ID","")
          branch = os.environ.get("GITHUB_REF_NAME","unknown")
          env_l  = os.environ.get("ENV_LABEL","STAGE")
          allure_base = f"https://github.com/{repo}/actions/runs/{run_id}#artifacts"

          summaries = []
          for f in sorted(glob.glob("platform-summaries/*/platform-summary.json")):
              try:
                  s = json.loads(pathlib.Path(f).read_text())
                  s["allureUrl"] = allure_base
                  summaries.append(s)
              except Exception as e:
                  print(f"skip {f}: {e}")

          report = {
            "env":      env_l,
            "testType": "e2e",
            "stage":    "post-deploy",
            "branch":   branch,
            "platforms": summaries,
          }
          pathlib.Path("api-test-report.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          EOF

      - name: Build E2E Slack payload
        if: always()
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          QUALITY_GATE_THRESHOLD: ${{ env.QUALITY_GATE_THRESHOLD }}
        run: python3 .github/scripts/api_tests_to_slack.py api-test-report.json

      - name: Inject thread_ts into E2E payload
        if: always() && needs.notify-start.outputs.thread_ts != ''
        run: |
          python3 - <<'EOF'
          import json, pathlib
          ts = "${{ needs.notify-start.outputs.thread_ts }}"
          p = json.loads(pathlib.Path("api-slack-payload.json").read_text())
          p["thread_ts"] = ts
          pathlib.Path("api-slack-payload.json").write_text(json.dumps(p))
          EOF

      - name: Upload Slack payload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-slack-payload
          path: api-slack-payload.json

      - name: Post E2E results as Slack thread reply
        if: always() && secrets.SLACK_BOT_TOKEN != '' && secrets.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./api-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
