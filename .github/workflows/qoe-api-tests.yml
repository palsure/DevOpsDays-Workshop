# QoE API Tests
#
# Pipeline flow:
#   0. notify-start      — Post "build started" to Slack; capture message ts for threading.
#   1. unit-tests        — @Tag("unit") tests (Mockito, no DB). Pre-deploy safety check.
#   2. bat-tests         — @Tag("BAT")  Build Acceptance Tests via ./gradlew batTest.
#                          Core sanity checks — if ANY BAT test fails the gate blocks.
#   3. bat-gate          — Evaluate BAT outcome (outputs: passed=true|false).
#                          PASS → deploy approved → run Smoke.
#                          FAIL → build blocked, Smoke skipped.
#   4. smoke-tests       — @Tag("Smoke") tests via ./gradlew smokeTest.
#                          Only runs when bat-gate PASSES.
#   5. automation-e2e    — System acceptance tests (Maven/TestNG).
#                          Only runs when smoke-tests succeed.
#   6. quality-gate      — Final aggregate gate (unit + BAT + Smoke + Automation).
#   7. api-report        — Collect Allure results, post full Slack summary.
#
# Required secrets (Slack steps are skipped when not set):
#   SLACK_BOT_TOKEN   — Slack bot OAuth token
#   SLACK_CHANNEL_ID  — Target channel ID

name: Stream-QoE-App-API

on:
  pull_request:
    paths:
      - 'backend-api/**'
      - '.github/workflows/qoe-api-tests.yml'
      - '.github/scripts/stage_result_to_slack.py'
      - '.github/scripts/module_result_to_slack.py'
  push:
    branches: [main, develop]
    paths:
      - 'backend-api/**'
      - '.github/workflows/qoe-api-tests.yml'
      - '.github/scripts/stage_result_to_slack.py'
      - '.github/scripts/module_result_to_slack.py'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests and bypass quality gate (hotfix mode)'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Environment label (STAGE / PROD)'
        required: false
        default: 'STAGE'

permissions:
  contents: write

env:
  QUALITY_GATE_THRESHOLD: '80'
  ENV_LABEL: ${{ github.event.inputs.environment || 'STAGE' }}
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# 0. NOTIFY START
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  notify-start:
    name: Notify — build started
    runs-on: ubuntu-latest
    outputs:
      thread_ts: ${{ steps.post.outputs.thread_ts }}

    steps:
      - name: Post "build started" to Slack
        id: post
        if: env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(python3 - <<EOF
          import json
          blocks = [
            {"type": "header", "text": {"type": "plain_text", "text": "[API] Stream-QoE-App  |  Build #${{ github.run_number }}", "emoji": True}},
            {"type": "section", "fields": [
              {"type": "mrkdwn", "text": "*Branch:*\n\`${{ github.ref_name }}\`"},
              {"type": "mrkdwn", "text": "*Environment:*\n${{ env.ENV_LABEL }}"},
              {"type": "mrkdwn", "text": "*Commit:*\n<$COMMIT_URL|${SHORT_SHA}>"},
              {"type": "mrkdwn", "text": "*Triggered by:*\n${{ github.actor }} (${{ github.event_name }})"},
            ]},
            {"type": "divider"},
            {"type": "context", "elements": [{"type": "mrkdwn", "text": "⏳ Unit tests → BAT → Smoke. Results will follow in this thread."}]},
            {"type": "actions", "elements": [{"type": "button", "text": {"type": "plain_text", "text": "View Run", "emoji": True}, "url": "$RUN_URL", "style": "primary"}]}
          ]
          print(json.dumps({"channel": "${{ env.SLACK_CHANNEL_ID }}", "unfurl_links": False, "unfurl_media": False, "blocks": blocks}))
          EOF
          )

          RESPONSE=$(curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Slack response: $RESPONSE"
          TS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ts',''))")
          echo "thread_ts=$TS" >> "$GITHUB_OUTPUT"

      - name: Set empty thread_ts when Slack not configured
        if: env.SLACK_BOT_TOKEN == '' || env.SLACK_CHANNEL_ID == ''
        run: echo "thread_ts=" >> "$GITHUB_OUTPUT"

# ─────────────────────────────────────────────────────────────────────────────
# 1. UNIT TESTS  — fast pre-deploy gate, no DB required
# ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (pre-deploy)
    runs-on: ubuntu-latest
    needs: notify-start
    if: inputs.skip_tests != true
    outputs:
      thread_ts: ${{ needs.notify-start.outputs.thread_ts }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend-api/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run unit tests
        id: unit
        run: ./gradlew unitTest --no-daemon
        working-directory: backend-api

      - name: Upload unit test results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backend-api/build/test-results/unitTest

      - name: Upload unit HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-html-report
          path: backend-api/build/reports/tests/unitTest

      - name: Post unit test result to Slack thread
        if: always()
        env:
          MODULE_NAME: API
          STAGE_NAME: Unit Tests
          JUNIT_DIR: backend-api/build/test-results/unitTest
          STAGE_RESULT: ${{ steps.unit.outcome }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_number }}
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send unit test result to Slack
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./stage-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# 2. BAT — Build Acceptance Tests  (critical gate — blocks all downstream)
# ─────────────────────────────────────────────────────────────────────────────
  bat-tests:
    name: "BAT — Build Acceptance Tests"
    runs-on: ubuntu-latest
    needs: [notify-start, unit-tests]
    if: inputs.skip_tests != true && needs.unit-tests.result == 'success'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: qoe_user
          POSTGRES_PASSWORD: qoe_password
          POSTGRES_DB: qoe_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend-api/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run BAT tests
        id: bat
        run: ./gradlew batTest --no-daemon
        working-directory: backend-api
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/qoe_db
          SPRING_DATASOURCE_USERNAME: qoe_user
          SPRING_DATASOURCE_PASSWORD: qoe_password

      - name: Upload BAT test results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bat-test-results
          path: backend-api/build/test-results/batTest
          retention-days: 14

      - name: Upload BAT Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-bat
          path: backend-api/build/allure-results/bat
          retention-days: 14

      - name: Generate BAT Allure HTML report
        if: always()
        continue-on-error: true
        run: |
          gradle downloadAllure --no-daemon -p backend-api
          backend-api/build/allure/commandline/bin/allure generate \
            backend-api/build/allure-results/bat \
            --clean -o bat-allure-report

      - name: Upload BAT Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bat-allure-report
          path: bat-allure-report
          retention-days: 14

      - name: Post BAT result to Slack thread
        if: always()
        env:
          MODULE_NAME: API
          STAGE_NAME: BAT
          JUNIT_DIR: backend-api/build/test-results/batTest
          STAGE_RESULT: ${{ steps.bat.outcome }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_number }}
          THREAD_TS: ${{ needs.unit-tests.outputs.thread_ts }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send BAT Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./stage-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# 3. BAT GATE  — evaluate BAT result; decide approve or block
# ─────────────────────────────────────────────────────────────────────────────
  bat-gate:
    name: "BAT Quality Gate"
    runs-on: ubuntu-latest
    needs: [notify-start, unit-tests, bat-tests]
    if: always()
    outputs:
      passed: ${{ steps.evaluate.outputs.passed }}
      thread_ts: ${{ needs.unit-tests.outputs.thread_ts }}

    steps:
      - id: evaluate
        name: Evaluate BAT gate
        run: |
          SKIP="${{ inputs.skip_tests }}"
          BAT="${{ needs.bat-tests.result }}"

          if [ "$SKIP" = "true" ]; then
            echo "⚡ Force-publish mode — BAT skipped, gate bypassed"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          elif [ "$BAT" = "success" ]; then
            echo "✅ BAT gate PASSED — all Build Acceptance Tests succeeded"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ BAT gate FAILED (bat=$BAT) — blocking downstream jobs"
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post BAT gate decision to Slack
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          PASSED="${{ steps.evaluate.outputs.passed }}"
          TS="${{ needs.unit-tests.outputs.thread_ts }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$PASSED" = "true" ]; then
            ICON="✅"; MSG="BAT gate *PASSED* — deployment approved, running Smoke tests…"
          else
            ICON="🚫"; MSG="BAT gate *FAILED* — build *BLOCKED*. Smoke tests will not run."
          fi

          python3 - <<EOF
          import json, subprocess
          blocks = [
            {"type": "section", "text": {"type": "mrkdwn", "text": "$ICON $MSG"}},
            {"type": "context", "elements": [
              {"type": "mrkdwn", "text": "Build #${{ github.run_number }} · <$RUN_URL|View run>"}
            ]}
          ]
          payload = {
            "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
            "thread_ts": "$TS",
            "unfurl_links": False, "unfurl_media": False,
            "blocks": blocks
          }
          import pathlib
          pathlib.Path("bat-gate-payload.json").write_text(json.dumps(payload))
          EOF

          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ secrets.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @bat-gate-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# 4. SMOKE TESTS  — only run when BAT gate passes
# ─────────────────────────────────────────────────────────────────────────────
  smoke-tests:
    name: "Smoke Tests"
    runs-on: ubuntu-latest
    needs: [bat-gate]
    if: needs.bat-gate.outputs.passed == 'true'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: qoe_user
          POSTGRES_PASSWORD: qoe_password
          POSTGRES_DB: qoe_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend-api/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run Smoke tests
        id: smoke
        continue-on-error: true
        run: ./gradlew smokeTest --no-daemon
        working-directory: backend-api
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/qoe_db
          SPRING_DATASOURCE_USERNAME: qoe_user
          SPRING_DATASOURCE_PASSWORD: qoe_password

      - name: Upload Smoke test results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: backend-api/build/test-results/smokeTest
          retention-days: 14

      - name: Upload Smoke Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: backend-api/build/allure-results/smoke
          retention-days: 14

      - name: Generate Smoke Allure HTML report
        if: always()
        continue-on-error: true
        run: |
          gradle downloadAllure --no-daemon -p backend-api
          backend-api/build/allure/commandline/bin/allure generate \
            backend-api/build/allure-results/smoke \
            --clean -o smoke-allure-report

      - name: Upload Smoke Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-allure-report
          path: smoke-allure-report
          retention-days: 14

      - name: Post Smoke result to Slack thread
        if: always()
        env:
          MODULE_NAME: API
          STAGE_NAME: Smoke Tests
          JUNIT_DIR: backend-api/build/test-results/smokeTest
          STAGE_RESULT: ${{ steps.smoke.outcome }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_number }}
          THREAD_TS: ${{ needs.bat-gate.outputs.thread_ts }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send Smoke Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./stage-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

      - name: Fail if smoke tests failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# 5. AUTOMATION E2E  — system-level acceptance; runs after Smoke passes
# ─────────────────────────────────────────────────────────────────────────────
  automation-e2e:
    name: Acceptance Tests (System)
    needs: [bat-gate, smoke-tests]
    runs-on: ubuntu-latest
    if: needs.bat-gate.outputs.passed == 'true' && needs.smoke-tests.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Start backend stack (Docker Compose)
        run: docker compose up -d postgres backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "backend is up"; exit 0
            fi
            echo "waiting… ($i/36)"; sleep 5
          done
          docker compose logs backend; exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('qoe-automation-tests/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Run automation E2E tests
        id: auto_e2e
        continue-on-error: true
        run: mvn -B test -Dapi.base.url=http://localhost:8080
        working-directory: qoe-automation-tests

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-automation-surefire
          path: qoe-automation-tests/target/surefire-reports/
          retention-days: 14

      - name: Generate Allure HTML report
        if: always()
        run: mvn --no-transfer-progress allure:report -q
        working-directory: qoe-automation-tests
        continue-on-error: true

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-acceptance-allure-report
          path: qoe-automation-tests/target/allure-report/
          retention-days: 14

      - name: Tear down Docker stack
        if: always()
        run: docker compose down -v || true

      - name: Post automation E2E result to Slack thread
        if: always()
        env:
          MODULE_NAME: API
          STAGE_NAME: Acceptance Tests
          JUNIT_DIR: qoe-automation-tests/target/surefire-reports
          STAGE_RESULT: ${{ steps.auto_e2e.outcome }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_number }}
          THREAD_TS: ${{ needs.bat-gate.outputs.thread_ts }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send automation E2E Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./stage-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

      - name: Fail if automation tests failed
        if: steps.auto_e2e.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# 6. QUALITY GATE  — final aggregate; passes when all stages succeed
# ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: "Quality Gate"
    runs-on: ubuntu-latest
    needs: [notify-start, unit-tests, bat-tests, bat-gate, smoke-tests, automation-e2e]
    if: always()
    outputs:
      passed: ${{ steps.check.outputs.passed }}

    steps:
      - id: check
        name: Evaluate quality gate
        run: |
          SKIP="${{ inputs.skip_tests }}"
          UNIT="${{ needs.unit-tests.result }}"
          BAT="${{ needs.bat-tests.result }}"
          BAT_GATE="${{ needs.bat-gate.outputs.passed }}"
          SMOKE="${{ needs.smoke-tests.result }}"
          ACCEPT="${{ needs.automation-e2e.result }}"

          if [ "$SKIP" = "true" ]; then
            echo "⚡ Force-publish mode — tests skipped, gate bypassed"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          elif [ "$BAT_GATE" != "true" ]; then
            echo "❌ Quality gate FAILED — BAT gate did not pass (unit=$UNIT, bat=$BAT)"
            echo "passed=false" >> "$GITHUB_OUTPUT"
          elif [ "$UNIT" = "success" ] && [ "$SMOKE" != "failure" ] && [ "$ACCEPT" != "failure" ]; then
            echo "✅ Quality gate PASSED (unit=$UNIT, bat=$BAT, smoke=$SMOKE, acceptance=$ACCEPT)"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Quality gate FAILED (unit=$UNIT, bat=$BAT, smoke=$SMOKE, acceptance=$ACCEPT)"
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# 7. API REPORT + SLACK  — aggregate Allure, post final summary
# ─────────────────────────────────────────────────────────────────────────────
  api-report:
    name: API Report & Slack notification
    needs: [notify-start, unit-tests, bat-tests, bat-gate, smoke-tests, automation-e2e, quality-gate]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: allure-results-*
          path: allure-results-all
          merge-multiple: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend-api/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Generate combined Allure report
        if: always()
        run: |
          if [ -d allure-results-all ] && [ "$(ls -A allure-results-all 2>/dev/null)" ]; then
            gradle downloadAllure --no-daemon -p backend-api
            backend-api/build/allure/commandline/bin/allure generate allure-results-all \
              --clean -o allure-report
          else
            echo "No Allure results found, skipping report generation"
            mkdir -p allure-report
          fi

      - name: Upload combined Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-combined
          path: allure-report
          retention-days: 14

      - name: Ensure allure-report exists for Pages deploy
        if: always()
        run: |
          if [ ! -f allure-report/index.html ]; then
            mkdir -p allure-report
            echo "<html><body><h2>No Allure results for this run.</h2></body></html>" > allure-report/index.html
          fi

      - name: Deploy Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          destination_dir: allure/${{ github.run_number }}
          keep_files: true

      - name: Post final Slack summary
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          ENV_LABEL: ${{ env.ENV_LABEL }}
          MODULE_NAME: API
          STAGE1_NAME: Unit Tests
          STAGE1_RESULT: ${{ needs.unit-tests.result }}
          STAGE2_NAME: BAT
          STAGE2_RESULT: ${{ needs.bat-tests.result }}
          STAGE3_NAME: BAT Gate
          STAGE3_RESULT: ${{ needs.bat-gate.outputs.passed == 'true' && 'success' || 'failure' }}
          STAGE4_NAME: Smoke Tests
          STAGE4_RESULT: ${{ needs.smoke-tests.result }}
          STAGE5_NAME: Acceptance Tests
          STAGE5_RESULT: ${{ needs.automation-e2e.result }}
          THREAD_TS: ${{ needs.unit-tests.outputs.thread_ts }}
        run: python3 .github/scripts/module_result_to_slack.py

      - name: Send final summary to Slack
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./module-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
