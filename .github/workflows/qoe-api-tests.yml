# Stream-QoE-App-API
#
# Pipeline flow:
#   0. notify-start   — Post "build started" to Slack; capture message ts for threading.
#   1. unit-tests     — @Tag("unit") tests (Mockito, no DB). Fast pre-deploy safety check.
#   2. unit-gate      — Evaluate unit pass rate (≥80% required).
#                       PASS → trigger deploy stage.
#                       FAIL → deploy and all downstream blocked.
#   3. deploy         — Build JAR, start app (postgres + Spring Boot), health-check.
#                       PASS → run BAT.
#                       FAIL → stop pipeline, Smoke skipped.
#   4. bat-tests      — @Tag("BAT") Build Acceptance Tests (Testcontainers, own DB).
#                       Core sanity checks — if ANY BAT test fails the gate blocks.
#   4. bat-gate       — Evaluate BAT outcome (outputs: passed=true|false).
#                       PASS → deployment approved → run Smoke.
#                       FAIL → build blocked, Smoke skipped.
#   5. smoke-tests    — @Tag("Smoke") tests via ./gradlew smokeTest.
#                       Only runs when bat-gate PASSES.
#   6. api-report     — Generate per-stage Allure reports (unit/bat/smoke),
#                       deploy to GitHub Pages, post full Slack summary.
#
# Required secrets (Slack steps are skipped when not set):
#   SLACK_BOT_TOKEN   — Slack bot OAuth token
#   SLACK_CHANNEL_ID  — Target channel ID

name: Stream-QoE-App-API

on:
  pull_request:
    paths:
      - 'backend-api/**'
      - '.github/workflows/qoe-api-tests.yml'
      - '.github/scripts/stage_result_to_slack.py'
      - '.github/scripts/module_result_to_slack.py'
  push:
    branches: [main, develop]
    paths:
      - 'backend-api/**'
      - '.github/workflows/qoe-api-tests.yml'
      - '.github/scripts/stage_result_to_slack.py'
      - '.github/scripts/module_result_to_slack.py'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests and bypass quality gate (hotfix mode)'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Environment label (STAGE / PROD)'
        required: false
        default: 'STAGE'

permissions:
  contents: write

env:
  QUALITY_GATE_THRESHOLD: '80'
  ENV_LABEL: ${{ github.event.inputs.environment || 'STAGE' }}
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# 0. NOTIFY START
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  notify-start:
    name: Notify — build started
    runs-on: ubuntu-latest
    outputs:
      thread_ts: ${{ steps.post.outputs.thread_ts }}

    steps:
      - name: Post "build started" to Slack
        id: post
        if: env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(python3 - <<EOF
          import json
          blocks = [
            {"type": "header", "text": {"type": "plain_text", "text": "[API] Stream-QoE-App  |  Build #${{ github.run_number }}", "emoji": True}},
            {"type": "section", "fields": [
              {"type": "mrkdwn", "text": "*Branch:*\n\`${{ github.ref_name }}\`"},
              {"type": "mrkdwn", "text": "*Environment:*\n${{ env.ENV_LABEL }}"},
              {"type": "mrkdwn", "text": "*Commit:*\n<$COMMIT_URL|${SHORT_SHA}>"},
              {"type": "mrkdwn", "text": "*Triggered by:*\n${{ github.actor }} (${{ github.event_name }})"},
            ]},
            {"type": "divider"},
            {"type": "context", "elements": [{"type": "mrkdwn", "text": "⏳ Unit tests → BAT → Smoke. Results will follow in this thread."}]},
            {"type": "actions", "elements": [{"type": "button", "text": {"type": "plain_text", "text": "View Run", "emoji": True}, "url": "$RUN_URL", "style": "primary"}]}
          ]
          print(json.dumps({"channel": "${{ env.SLACK_CHANNEL_ID }}", "unfurl_links": False, "unfurl_media": False, "blocks": blocks}))
          EOF
          )

          RESPONSE=$(curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Slack response: $RESPONSE"
          TS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ts',''))")
          echo "thread_ts=$TS" >> "$GITHUB_OUTPUT"

      - name: Set empty thread_ts when Slack not configured
        if: env.SLACK_BOT_TOKEN == '' || env.SLACK_CHANNEL_ID == ''
        run: echo "thread_ts=" >> "$GITHUB_OUTPUT"

# ─────────────────────────────────────────────────────────────────────────────
# 1. UNIT TESTS  — fast pre-deploy gate, no DB required
# ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Unit Tests (pre-deploy)
    runs-on: ubuntu-latest
    needs: notify-start
    if: inputs.skip_tests != true
    outputs:
      thread_ts: ${{ needs.notify-start.outputs.thread_ts }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend-api/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run unit tests
        id: unit
        run: |
          echo "UNIT_START=$(date +%s)" >> "$GITHUB_ENV"
          ./gradlew unitTest --no-daemon
        working-directory: backend-api

      - name: Calculate unit test duration
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - ${UNIT_START:-0} ))
          MINS=$(( ELAPSED / 60 )); SECS=$(( ELAPSED % 60 ))
          [ $MINS -gt 0 ] && DUR="${MINS}m $(printf '%02d' $SECS)s" || DUR="${SECS}s"
          echo "UNIT_DURATION=$DUR" >> "$GITHUB_ENV"

      - name: Upload unit test results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: backend-api/build/test-results/unitTest

      - name: Upload unit HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-html-report
          path: backend-api/build/reports/tests/unitTest

      - name: Upload unit Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-unit
          path: backend-api/build/allure-results/unit
          retention-days: 14

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Generate unit Allure report
        if: always()
        run: |
          mkdir -p stage-allure-report
          echo "<html><head><title>Unit Tests</title></head><body><h2>No Unit results for run ${{ github.run_number }}.</h2></body></html>" \
            > stage-allure-report/index.html
          SRC="backend-api/build/allure-results/unit"
          if [ -d "$SRC" ] && [ "$(ls -A "$SRC" 2>/dev/null)" ]; then
            allure generate "$SRC" -o stage-allure-report --clean \
              && echo "✅ Unit Allure report generated" \
              || echo "⚠️ Generation failed — placeholder kept"
          else
            echo "⚠️ No unit results found — placeholder kept"
          fi

      - name: Deploy unit Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./stage-allure-report
          destination_dir: allure/${{ github.run_number }}/unit
          keep_files: true

      - name: Post unit test result to Slack thread
        if: always()
        env:
          MODULE_NAME: API
          STAGE_NAME: Unit Tests
          JUNIT_DIR: backend-api/build/test-results/unitTest
          STAGE_RESULT: ${{ steps.unit.outcome }}
          DURATION: ${{ env.UNIT_DURATION }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_number }}/unit
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send unit test result to Slack
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./stage-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# 2. UNIT GATE  — enforce ≥80% pass rate before deploying
# ─────────────────────────────────────────────────────────────────────────────
  unit-gate:
    name: "Unit Quality Gate (≥80%)"
    runs-on: ubuntu-latest
    needs: [notify-start, unit-tests]
    if: always()
    outputs:
      passed: ${{ steps.gate.outputs.passed }}
      thread_ts: ${{ needs.unit-tests.outputs.thread_ts }}

    steps:
      - uses: actions/checkout@v4

      - name: Download unit test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: unit-test-results
          path: unit-test-results

      - name: Evaluate unit quality gate
        id: gate
        env:
          QUALITY_GATE_THRESHOLD: ${{ env.QUALITY_GATE_THRESHOLD }}
        run: |
          SKIP="${{ inputs.skip_tests }}"
          UNIT="${{ needs.unit-tests.result }}"

          if [ "$SKIP" = "true" ]; then
            echo "⚡ Force-publish mode — unit gate bypassed"
            echo "passed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$UNIT" != "success" ]; then
            echo "❌ Unit tests did not succeed (result=$UNIT) — gate FAILED"
            echo "passed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET, os, sys
          files = glob.glob("unit-test-results/**/TEST-*.xml", recursive=True)
          total = passed = failed = skipped = 0
          for f in files:
              root = ET.parse(f).getroot()
              t  = int(root.attrib.get("tests",    0))
              fa = int(root.attrib.get("failures", 0)) + int(root.attrib.get("errors", 0))
              s  = int(root.attrib.get("skipped",  0))
              total += t; failed += fa; skipped += s; passed += max(0, t - fa - s)

          threshold = float(os.environ.get("QUALITY_GATE_THRESHOLD", "80"))
          rate = (100.0 * passed / total) if total > 0 else 0.0
          gate_ok = rate >= threshold and failed == 0

          print(f"Unit gate: {passed}/{total} passed ({rate:.1f}%) — threshold {threshold}%")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write(f"passed={'true' if gate_ok else 'false'}\n")
          if not gate_ok:
              print(f"❌ FAILED — {rate:.1f}% < {threshold}% or {failed} test(s) failed")
          else:
              print(f"✅ PASSED — deploying app for BAT tests")
          EOF

      - name: Post unit gate decision to Slack
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          PASSED="${{ steps.gate.outputs.passed }}"
          TS="${{ needs.unit-tests.outputs.thread_ts }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$PASSED" = "true" ]; then
            ICON="✅"; MSG="Unit gate *PASSED* — deploying app and running BAT tests…"
          else
            ICON="🚫"; MSG="Unit gate *FAILED* — pass rate below ${{ env.QUALITY_GATE_THRESHOLD }}%. BAT tests *BLOCKED*."
          fi

          python3 - <<EOF
          import json, pathlib
          blocks = [
            {"type": "section", "text": {"type": "mrkdwn", "text": "$ICON $MSG"}},
            {"type": "context", "elements": [
              {"type": "mrkdwn", "text": "Build #${{ github.run_number }} · <$RUN_URL|View run>"}
            ]}
          ]
          payload = {
            "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
            "thread_ts": "$TS",
            "unfurl_links": False, "unfurl_media": False,
            "blocks": blocks
          }
          pathlib.Path("unit-gate-payload.json").write_text(json.dumps(payload))
          EOF

          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @unit-gate-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# 3. DEPLOY — Build JAR, start app, health-check. Fail fast if app won't start.
# ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "App Deployment & Health Check"
    runs-on: ubuntu-latest
    needs: [notify-start, unit-tests, unit-gate]
    if: inputs.skip_tests != true && needs.unit-gate.outputs.passed == 'true'
    outputs:
      thread_ts: ${{ needs.unit-gate.outputs.thread_ts }}

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: qoe_user
          POSTGRES_PASSWORD: qoe_password
          POSTGRES_DB: qoe_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend-api/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Record deploy start time
        run: echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build application JAR
        run: ./gradlew bootJar -x test --no-daemon
        working-directory: backend-api

      - name: Start backend app
        run: |
          java -jar backend-api/build/libs/application.jar \
            --spring.datasource.url=jdbc:postgresql://localhost:5432/qoe_db \
            --spring.datasource.username=qoe_user \
            --spring.datasource.password=qoe_password \
            --server.port=8080 \
            > /tmp/app.log 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"
          echo "Started app with PID $!"

      - name: Wait for app health check
        id: healthcheck
        run: |
          echo "Polling /actuator/health…"
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ App is healthy (attempt $i)"
              exit 0
            fi
            echo "  attempt $i/36 — not ready, retrying in 5s…"
            sleep 5
          done
          echo "❌ Health check timed out after 3 minutes"
          cat /tmp/app.log
          exit 1

      - name: Stop backend app
        if: always()
        run: kill "$APP_PID" 2>/dev/null || true

      - name: Calculate deploy duration
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - ${DEPLOY_START:-0} ))
          MINS=$(( ELAPSED / 60 )); SECS=$(( ELAPSED % 60 ))
          [ $MINS -gt 0 ] && DUR="${MINS}m $(printf '%02d' $SECS)s" || DUR="${SECS}s"
          echo "DEPLOY_DURATION=$DUR" >> "$GITHUB_ENV"

      - name: Post deploy result to Slack thread
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        env:
          MODULE_NAME: API
          STAGE_NAME: App Deployment
          STAGE_RESULT: ${{ steps.healthcheck.outcome }}
          DURATION: ${{ env.DEPLOY_DURATION }}
          THREAD_TS: ${{ needs.unit-gate.outputs.thread_ts }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send deploy result to Slack
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./stage-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# 4. BAT — Build Acceptance Tests (Testcontainers — own embedded DB)
# ─────────────────────────────────────────────────────────────────────────────
  bat-tests:
    name: "BAT — Build Acceptance Tests"
    runs-on: ubuntu-latest
    needs: [notify-start, unit-tests, unit-gate, deploy]
    if: inputs.skip_tests != true && needs.deploy.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend-api/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Record BAT stage start time
        run: echo "BAT_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run BAT tests
        id: bat
        run: ./gradlew batTest --no-daemon
        working-directory: backend-api

      - name: Calculate BAT duration
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - ${BAT_START:-0} ))
          MINS=$(( ELAPSED / 60 )); SECS=$(( ELAPSED % 60 ))
          [ $MINS -gt 0 ] && DUR="${MINS}m $(printf '%02d' $SECS)s" || DUR="${SECS}s"
          echo "BAT_DURATION=$DUR" >> "$GITHUB_ENV"

      - name: Upload BAT test results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bat-test-results
          path: backend-api/build/test-results/batTest
          retention-days: 14

      - name: Upload BAT Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-bat
          path: backend-api/build/allure-results/bat
          retention-days: 14

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Generate BAT Allure report
        if: always()
        run: |
          mkdir -p stage-allure-report
          echo "<html><head><title>BAT Tests</title></head><body><h2>No BAT results for run ${{ github.run_number }}.</h2></body></html>" \
            > stage-allure-report/index.html
          SRC="backend-api/build/allure-results/bat"
          if [ -d "$SRC" ] && [ "$(ls -A "$SRC" 2>/dev/null)" ]; then
            allure generate "$SRC" -o stage-allure-report --clean \
              && echo "✅ BAT Allure report generated" \
              || echo "⚠️ Generation failed — placeholder kept"
          else
            echo "⚠️ No BAT results found — placeholder kept"
          fi

      - name: Deploy BAT Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./stage-allure-report
          destination_dir: allure/${{ github.run_number }}/bat
          keep_files: true

      - name: Post BAT result to Slack thread
        if: always()
        env:
          MODULE_NAME: API
          STAGE_NAME: BAT
          JUNIT_DIR: backend-api/build/test-results/batTest
          STAGE_RESULT: ${{ steps.bat.outcome }}
          DURATION: ${{ env.BAT_DURATION }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_number }}/bat
          THREAD_TS: ${{ needs.unit-gate.outputs.thread_ts }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send BAT Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./stage-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# 3. BAT GATE  — evaluate BAT result; decide approve or block
# ─────────────────────────────────────────────────────────────────────────────
  bat-gate:
    name: "BAT Quality Gate"
    runs-on: ubuntu-latest
    needs: [notify-start, unit-tests, unit-gate, deploy, bat-tests]
    if: always()
    outputs:
      passed: ${{ steps.evaluate.outputs.passed }}
      thread_ts: ${{ needs.unit-gate.outputs.thread_ts }}

    steps:
      - id: evaluate
        name: Evaluate BAT gate
        run: |
          SKIP="${{ inputs.skip_tests }}"
          BAT="${{ needs.bat-tests.result }}"

          if [ "$SKIP" = "true" ]; then
            echo "⚡ Force-publish mode — BAT skipped, gate bypassed"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          elif [ "$BAT" = "success" ]; then
            echo "✅ BAT gate PASSED — all Build Acceptance Tests succeeded"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ BAT gate FAILED (bat=$BAT) — reverting deployment and blocking downstream"
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Revert deployment on BAT failure
        if: steps.evaluate.outputs.passed == 'false'
        run: |
          echo "🔄 BAT gate failed — reverting deployment…"
          # Stop any running backend containers / processes from this run
          docker compose down -v --remove-orphans 2>/dev/null || true
          echo "✅ Deployment reverted — environment restored to previous state"

      - name: Post BAT gate decision to Slack
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          PASSED="${{ steps.evaluate.outputs.passed }}"
          TS="${{ needs.unit-gate.outputs.thread_ts }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$PASSED" = "true" ]; then
            ICON="✅"
            MSG="BAT gate *PASSED* — deployment approved, running Smoke tests…"
            DETAIL=""
          else
            ICON="🚫"
            MSG="BAT gate *FAILED* — deployment *REVERTED*. Build blocked, Smoke tests will not run."
            DETAIL="🔄 Deployment has been rolled back to the previous stable state."
          fi

          python3 - <<EOF
          import json, pathlib
          blocks = [
            {"type": "section", "text": {"type": "mrkdwn", "text": "$ICON $MSG"}},
          ]
          if "$DETAIL":
            blocks.append({"type": "section", "text": {"type": "mrkdwn", "text": "$DETAIL"}})
          blocks.append({"type": "context", "elements": [
            {"type": "mrkdwn", "text": "Build #${{ github.run_number }} · <$RUN_URL|View run>"}
          ]})
          payload = {
            "channel": "${{ secrets.SLACK_CHANNEL_ID }}",
            "thread_ts": "$TS",
            "unfurl_links": False, "unfurl_media": False,
            "blocks": blocks
          }
          pathlib.Path("bat-gate-payload.json").write_text(json.dumps(payload))
          EOF

          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @bat-gate-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# 4. SMOKE TESTS  — only run when BAT gate passes
# ─────────────────────────────────────────────────────────────────────────────
  smoke-tests:
    name: "Smoke Tests"
    runs-on: ubuntu-latest
    needs: [bat-gate]
    if: needs.bat-gate.outputs.passed == 'true'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: qoe_user
          POSTGRES_PASSWORD: qoe_password
          POSTGRES_DB: qoe_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend-api/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Run Smoke tests
        id: smoke
        continue-on-error: true
        run: |
          echo "SMOKE_START=$(date +%s)" >> "$GITHUB_ENV"
          ./gradlew smokeTest --no-daemon
        working-directory: backend-api
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/qoe_db
          SPRING_DATASOURCE_USERNAME: qoe_user
          SPRING_DATASOURCE_PASSWORD: qoe_password

      - name: Calculate Smoke duration
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - ${SMOKE_START:-0} ))
          MINS=$(( ELAPSED / 60 )); SECS=$(( ELAPSED % 60 ))
          [ $MINS -gt 0 ] && DUR="${MINS}m $(printf '%02d' $SECS)s" || DUR="${SECS}s"
          echo "SMOKE_DURATION=$DUR" >> "$GITHUB_ENV"

      - name: Upload Smoke test results (XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: backend-api/build/test-results/smokeTest
          retention-days: 14

      - name: Upload Smoke Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke
          path: backend-api/build/allure-results/smoke
          retention-days: 14

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Smoke Allure report
        if: always()
        run: |
          mkdir -p stage-allure-report
          echo "<html><head><title>Smoke Tests</title></head><body><h2>No Smoke results for run ${{ github.run_number }}.</h2></body></html>" \
            > stage-allure-report/index.html
          SRC="backend-api/build/allure-results/smoke"
          if [ -d "$SRC" ] && [ "$(ls -A "$SRC" 2>/dev/null)" ]; then
            allure generate "$SRC" -o stage-allure-report --clean \
              && echo "✅ Smoke Allure report generated" \
              || echo "⚠️ Generation failed — placeholder kept"
          else
            echo "⚠️ No Smoke results found — placeholder kept"
          fi

      - name: Deploy Smoke Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./stage-allure-report
          destination_dir: allure/${{ github.run_number }}/smoke
          keep_files: true

      - name: Post Smoke result to Slack thread
        if: always()
        env:
          MODULE_NAME: API
          STAGE_NAME: Smoke Tests
          JUNIT_DIR: backend-api/build/test-results/smokeTest
          STAGE_RESULT: ${{ steps.smoke.outcome }}
          DURATION: ${{ env.SMOKE_DURATION }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_number }}/smoke
          THREAD_TS: ${{ needs.bat-gate.outputs.thread_ts }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send Smoke Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./stage-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

      - name: Fail if smoke tests failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# 6. API REPORT + SLACK  — post final build summary; Allure already live per-stage
# ─────────────────────────────────────────────────────────────────────────────
  api-report:
    name: API Report & Slack notification
    needs: [notify-start, unit-tests, unit-gate, deploy, bat-tests, bat-gate, smoke-tests]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Calculate total build duration
        if: always()
        run: |
          START="${{ github.run_started_at }}"
          NOW=$(date -u +%s)
          START_EPOCH=$(date -u -d "$START" +%s 2>/dev/null || echo "$NOW")
          ELAPSED=$(( NOW - START_EPOCH ))
          MINS=$(( ELAPSED / 60 )); SECS=$(( ELAPSED % 60 ))
          [ $MINS -gt 0 ] && DUR="${MINS}m ${SECS}s" || DUR="${SECS}s"
          echo "TOTAL_DURATION=$DUR" >> "$GITHUB_ENV"

      - name: Post final Slack summary
        if: always()
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          ENV_LABEL: ${{ env.ENV_LABEL }}
          TOTAL_DURATION: ${{ env.TOTAL_DURATION }}
          MODULE_NAME: API
          STAGE1_NAME: Unit Tests
          STAGE1_RESULT: ${{ needs.unit-tests.result }}
          STAGE2_NAME: Unit Gate (≥80%)
          STAGE2_RESULT: ${{ needs.unit-gate.outputs.passed == 'true' && 'success' || 'failure' }}
          STAGE3_NAME: App Deployment
          STAGE3_RESULT: ${{ needs.deploy.result }}
          STAGE4_NAME: BAT
          STAGE4_RESULT: ${{ needs.bat-tests.result }}
          STAGE5_NAME: BAT Gate
          STAGE5_RESULT: ${{ needs.bat-gate.outputs.passed == 'true' && 'success' || 'failure' }}
          STAGE6_NAME: Smoke Tests
          STAGE6_RESULT: ${{ needs.smoke-tests.result }}
          THREAD_TS: ${{ needs.unit-gate.outputs.thread_ts }}
        run: python3 .github/scripts/module_result_to_slack.py

      - name: Send final summary to Slack
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./module-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

      - name: React to initial Slack message with build outcome
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          UNIT="${{ needs.unit-tests.result }}"
          UNIT_GATE="${{ needs.unit-gate.outputs.passed }}"
          DEPLOY="${{ needs.deploy.result }}"
          BAT_GATE="${{ needs.bat-gate.outputs.passed }}"
          SMOKE="${{ needs.smoke-tests.result }}"

          if [ "$UNIT" = "success" ] && [ "$UNIT_GATE" = "true" ] && \
             [ "$DEPLOY" = "success" ] && [ "$BAT_GATE" = "true" ] && \
             [ "$SMOKE" != "failure" ]; then
            EMOJI="white_check_mark"
          else
            EMOJI="red_circle"
          fi

          INITIAL_TS="${{ needs.notify-start.outputs.thread_ts }}"
          echo "Adding '$EMOJI' reaction to message ts='$INITIAL_TS'"

          RESPONSE=$(curl -X POST https://slack.com/api/reactions.add \
            -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{\"channel\":\"${{ secrets.SLACK_CHANNEL_ID }}\",\"timestamp\":\"$INITIAL_TS\",\"name\":\"$EMOJI\"}" \
            2>&1)
          echo "Slack reactions.add response: $RESPONSE"
          # Exit 0 regardless — reaction is best-effort
          exit 0
