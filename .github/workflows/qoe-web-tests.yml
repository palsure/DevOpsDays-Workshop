# Stream-QoE-App-Web
#
# Pipeline flow (mirrors qoe-api-tests.yml):
#   0. notify-start    — Post "build started" to Slack; capture thread_ts + start_epoch.
#   1. build           — tsc + vite build; produces deployable dist/ artifact.
#   2. unit-tests      — Vitest + lint. Fast pre-deploy gate; no browser required.
#                        Allure results → allure-results/unit → GitHub Pages.
#   3. unit-gate       — Evaluate pass rate (≥80% required).
#                        PASS → trigger BAT. FAIL → BAT + downstream blocked.
#   4. bat-tests       — @BAT Playwright tests (4 workers, ~45 s timeout).
#                        Core sanity checks — if ANY BAT test fails the gate blocks.
#                        Allure results → allure-results/bat → GitHub Pages.
#   5. bat-gate        — Evaluate BAT outcome.
#                        PASS → deploy preview + run Smoke.
#                        FAIL → build blocked, Smoke & Regression skipped.
#   6. deploy-preview  — Deploy dist/ to Firebase Hosting preview channel.
#   7. smoke-tests     — @Smoke Playwright tests (3 workers, ~90 s timeout).
#                        Broader coverage; runs against the preview URL.
#                        Allure results → allure-results/smoke → GitHub Pages.
#   8. regression-tests— @Regression Playwright tests (2 workers, ~120 s timeout).
#                        Network-throttle & advanced scenarios. Non-blocking gate.
#                        Allure results → allure-results/regression → GitHub Pages.
#   9. promote-live    — Promote Firebase preview to live channel when Smoke passes.
#  10. rollback-preview— Delete preview channel when Smoke fails (live unchanged).
#  11. report          — Final pipeline summary to GitHub Step Summary + Slack.
#
# Required secrets (Slack steps are skipped when not set):
#   SLACK_BOT_TOKEN       — Slack bot OAuth token
#   SLACK_CHANNEL_ID      — Target Slack channel ID
# Optional secrets:
#   FIREBASE_TOKEN        — Firebase CI token (`firebase login:ci`)
#   FIREBASE_PROJECT_ID   — Firebase project ID

name: Stream-QoE-App-Web

on:
  pull_request:
    paths:
      - 'web-player/**'
      - '.github/workflows/qoe-web-tests.yml'
      - '.github/scripts/stage_result_to_slack.py'
      - '.github/scripts/module_result_to_slack.py'
  push:
    branches: [main, develop]
    paths:
      - 'web-player/**'
      - '.github/workflows/qoe-web-tests.yml'
      - '.github/scripts/stage_result_to_slack.py'
      - '.github/scripts/module_result_to_slack.py'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests and force-publish to Firebase (hotfix mode)'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Target environment (STAGE / PROD)'
        required: false
        default: 'STAGE'

permissions:
  contents: write

env:
  QUALITY_GATE_THRESHOLD: '80'
  ENV_LABEL: ${{ github.event.inputs.environment || 'STAGE' }}
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# 0. NOTIFY START
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  notify-start:
    name: Notify — build started
    runs-on: ubuntu-latest
    outputs:
      thread_ts:   ${{ steps.post.outputs.thread_ts }}
      start_epoch: ${{ steps.epoch.outputs.start_epoch }}

    steps:
      - name: Post "build started" to Slack
        id: post
        if: env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(python3 - <<EOF
          import json
          blocks = [
            {"type": "header", "text": {"type": "plain_text", "text": "[WEB] Stream-QoE-App  |  Build #${{ github.run_number }}", "emoji": True}},
            {"type": "section", "fields": [
              {"type": "mrkdwn", "text": "*Branch:*\n\`${{ github.ref_name }}\`"},
              {"type": "mrkdwn", "text": "*Environment:*\n${{ env.ENV_LABEL }}"},
              {"type": "mrkdwn", "text": "*Commit:*\n<$COMMIT_URL|${SHORT_SHA}>"},
              {"type": "mrkdwn", "text": "*Triggered by:*\n${{ github.actor }} (${{ github.event_name }})"},
            ]},
            {"type": "divider"},
            {"type": "context", "elements": [{"type": "mrkdwn", "text": "⏳ Unit → BAT → Smoke → Regression. Results will follow in this thread."}]},
            {"type": "actions", "elements": [{"type": "button", "text": {"type": "plain_text", "text": "View Run", "emoji": True}, "url": "$RUN_URL", "style": "primary"}]}
          ]
          print(json.dumps({"channel": "${{ env.SLACK_CHANNEL_ID }}", "unfurl_links": False, "unfurl_media": False, "blocks": blocks}))
          EOF
          )

          RESPONSE=$(curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Slack response: $RESPONSE"
          TS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ts',''))")
          echo "thread_ts=$TS" >> "$GITHUB_OUTPUT"

      - name: Set empty thread_ts when Slack not configured
        if: env.SLACK_BOT_TOKEN == '' || env.SLACK_CHANNEL_ID == ''
        run: echo "thread_ts=" >> "$GITHUB_OUTPUT"

      - name: Record pipeline start epoch
        id: epoch
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

# ─────────────────────────────────────────────────────────────────────────────
# 1. BUILD — tsc + vite build; produces deployable dist/ artifact
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "Build"
    runs-on: ubuntu-latest
    needs: notify-start

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-player/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web-player

      - name: Lint
        run: npm run lint
        working-directory: web-player

      - name: Build
        run: npm run build
        working-directory: web-player

      - name: Upload build artifact (dist/)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-player/dist/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# 2. UNIT TESTS — Vitest; fast pre-deploy gate; no browser required
# ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: "Unit Tests (Vitest)"
    runs-on: ubuntu-latest
    needs: [notify-start, build]
    if: inputs.skip_tests != true && needs.build.result == 'success'
    outputs:
      thread_ts: ${{ needs.notify-start.outputs.thread_ts }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-player/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web-player

      - name: Record unit start time
        run: echo "UNIT_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run unit tests (Vitest)
        id: unit
        run: npm test
        working-directory: web-player

      - name: Calculate unit duration
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - ${UNIT_START:-0} ))
          MINS=$(( ELAPSED / 60 )); SECS=$(( ELAPSED % 60 ))
          [ $MINS -gt 0 ] && DUR="${MINS}m $(printf '%02d' $SECS)s" || DUR="${SECS}s"
          echo "UNIT_DURATION=$DUR" >> "$GITHUB_ENV"

      - name: Upload unit JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-unit-junit
          path: web-player/test-results/vitest-junit.xml
          retention-days: 14

      - name: Prepare unit Allure results (JUnit → allure-results/unit)
        if: always()
        run: |
          mkdir -p web-player/allure-results/unit
          cp web-player/test-results/vitest-junit.xml \
             web-player/allure-results/unit/TEST-vitest.xml 2>/dev/null || true

      - name: Upload unit Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web-unit
          path: web-player/allure-results/unit
          retention-days: 14

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Generate unit Allure report
        if: always()
        run: |
          mkdir -p stage-allure-report
          echo "<html><head><title>Web Unit Tests</title></head><body><h2>No unit results for run ${{ github.run_number }}.</h2></body></html>" \
            > stage-allure-report/index.html
          SRC="web-player/allure-results/unit"
          if [ -d "$SRC" ] && [ "$(ls -A "$SRC" 2>/dev/null)" ]; then
            allure generate "$SRC" -o stage-allure-report --clean \
              && echo "✅ Unit Allure report generated" \
              || echo "⚠️ Generation failed — placeholder kept"
          fi

      - name: Deploy unit Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./stage-allure-report
          destination_dir: allure/${{ github.run_number }}/web/unit
          keep_files: true

      - name: Post unit test result to Slack thread
        if: always()
        env:
          MODULE_NAME: WEB
          STAGE_NAME: Unit Tests (Vitest)
          JUNIT_DIR: web-player/test-results
          STAGE_RESULT: ${{ steps.unit.outcome }}
          DURATION: ${{ env.UNIT_DURATION }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_number }}/web/unit
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send unit Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# 3. UNIT GATE — enforce ≥80% pass rate before BAT
# ─────────────────────────────────────────────────────────────────────────────
  unit-gate:
    name: "Unit Quality Gate (≥80%)"
    runs-on: ubuntu-latest
    needs: [notify-start, unit-tests]
    if: always()
    outputs:
      passed:    ${{ steps.gate.outputs.passed }}
      thread_ts: ${{ needs.notify-start.outputs.thread_ts }}

    steps:
      - uses: actions/checkout@v4

      - name: Download unit JUnit results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-unit-junit
          path: unit-test-results

      - name: Evaluate unit quality gate
        id: gate
        env:
          QUALITY_GATE_THRESHOLD: ${{ env.QUALITY_GATE_THRESHOLD }}
        run: |
          SKIP="${{ inputs.skip_tests }}"
          UNIT="${{ needs.unit-tests.result }}"

          if [ "$SKIP" = "true" ]; then
            echo "⚡ Hotfix mode — unit gate bypassed"
            echo "passed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if [ "$UNIT" != "success" ]; then
            echo "❌ Unit tests did not succeed (result=$UNIT) — gate FAILED"
            echo "passed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET, os, sys
          files = glob.glob("unit-test-results/**/*.xml", recursive=True)
          total = passed = failed = skipped = 0
          for f in files:
              root = ET.parse(f).getroot()
              # Handle both <testsuites> and <testsuite> root elements
              suites = root.findall('testsuite') if root.tag == 'testsuites' else [root]
              for s in suites:
                  t  = int(s.attrib.get("tests",    0))
                  fa = int(s.attrib.get("failures", 0)) + int(s.attrib.get("errors", 0))
                  sk = int(s.attrib.get("skipped",  0))
                  total += t; failed += fa; skipped += sk; passed += max(0, t - fa - sk)

          threshold = float(os.environ.get("QUALITY_GATE_THRESHOLD", "80"))
          rate = (100.0 * passed / total) if total > 0 else 0.0
          gate_ok = rate >= threshold and failed == 0

          print(f"Unit gate: {passed}/{total} passed ({rate:.1f}%) — threshold {threshold}%")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write(f"passed={'true' if gate_ok else 'false'}\n")
          if not gate_ok:
              print(f"❌ FAILED — {rate:.1f}% < {threshold}% or {failed} test(s) failed")
          else:
              print(f"✅ PASSED — running BAT tests")
          EOF

      - name: Post unit gate decision to Slack
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          PASSED="${{ steps.gate.outputs.passed }}"
          TS="${{ needs.notify-start.outputs.thread_ts }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$PASSED" = "true" ]; then
            ICON="✅"; MSG="Unit gate *PASSED* — running BAT tests…"
          else
            ICON="🚫"; MSG="Unit gate *FAILED* — pass rate below ${{ env.QUALITY_GATE_THRESHOLD }}%. BAT tests *BLOCKED*."
          fi
          python3 - <<EOF
          import json, pathlib
          blocks = [
            {"type": "section", "text": {"type": "mrkdwn", "text": "$ICON $MSG"}},
            {"type": "context", "elements": [{"type": "mrkdwn", "text": "Build #${{ github.run_number }} · <$RUN_URL|View run>"}]}
          ]
          payload = {"channel": "${{ secrets.SLACK_CHANNEL_ID }}", "thread_ts": "$TS",
                     "unfurl_links": False, "unfurl_media": False, "blocks": blocks}
          pathlib.Path("unit-gate-payload.json").write_text(json.dumps(payload))
          EOF
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @unit-gate-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# 4. BAT TESTS — @BAT Playwright tests; 4 workers, 45 s timeout per test
# ─────────────────────────────────────────────────────────────────────────────
  bat-tests:
    name: "BAT — Build Acceptance Tests"
    runs-on: ubuntu-latest
    needs: [notify-start, unit-tests, unit-gate]
    if: inputs.skip_tests != true && needs.unit-gate.outputs.passed == 'true'

    services:
      web-player:
        image: nginx:alpine
        ports:
          - 3000:80

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-player/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web-player

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web-player

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-player/dist

      - name: Serve dist/ on port 3000
        run: |
          npx serve web-player/dist -l 3000 &
          echo "SERVE_PID=$!" >> "$GITHUB_ENV"
          sleep 3
          curl -sf http://localhost:3000 > /dev/null && echo "✅ Dev server ready" || (echo "❌ Server not ready"; exit 1)

      - name: Record BAT start time
        run: echo "BAT_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run BAT tests (@BAT, 4 workers)
        id: bat
        run: npm run e2e:bat
        working-directory: web-player
        env:
          CI: 'true'

      - name: Calculate BAT duration
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - ${BAT_START:-0} ))
          MINS=$(( ELAPSED / 60 )); SECS=$(( ELAPSED % 60 ))
          [ $MINS -gt 0 ] && DUR="${MINS}m $(printf '%02d' $SECS)s" || DUR="${SECS}s"
          echo "BAT_DURATION=$DUR" >> "$GITHUB_ENV"

      - name: Stop dev server
        if: always()
        run: kill "$SERVE_PID" 2>/dev/null || true

      - name: Upload BAT Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-bat-playwright-report
          path: web-player/playwright-report/bat/
          retention-days: 14

      - name: Upload BAT Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web-bat
          path: web-player/allure-results/bat
          retention-days: 14

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Generate BAT Allure report
        if: always()
        run: |
          mkdir -p stage-allure-report
          echo "<html><head><title>Web BAT</title></head><body><h2>No BAT results for run ${{ github.run_number }}.</h2></body></html>" \
            > stage-allure-report/index.html
          SRC="web-player/allure-results/bat"
          if [ -d "$SRC" ] && [ "$(ls -A "$SRC" 2>/dev/null)" ]; then
            allure generate "$SRC" -o stage-allure-report --clean \
              && echo "✅ BAT Allure report generated" \
              || echo "⚠️ Generation failed — placeholder kept"
          fi

      - name: Deploy BAT Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./stage-allure-report
          destination_dir: allure/${{ github.run_number }}/web/bat
          keep_files: true

      - name: Post BAT result to Slack thread
        if: always()
        env:
          MODULE_NAME: WEB
          STAGE_NAME: BAT (Build Acceptance Tests)
          PLAYWRIGHT_JSON: web-player/playwright-results-bat.json
          STAGE_RESULT: ${{ steps.bat.outcome }}
          DURATION: ${{ env.BAT_DURATION }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_number }}/web/bat
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send BAT Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# 5. BAT GATE — block Smoke & downstream on any BAT failure
# ─────────────────────────────────────────────────────────────────────────────
  bat-gate:
    name: "BAT Quality Gate"
    runs-on: ubuntu-latest
    needs: [notify-start, unit-tests, unit-gate, bat-tests]
    if: always()
    outputs:
      passed:    ${{ steps.evaluate.outputs.passed }}
      thread_ts: ${{ needs.notify-start.outputs.thread_ts }}

    steps:
      - id: evaluate
        name: Evaluate BAT gate
        run: |
          SKIP="${{ inputs.skip_tests }}"
          BAT="${{ needs.bat-tests.result }}"

          if [ "$SKIP" = "true" ]; then
            echo "⚡ Hotfix mode — BAT gate bypassed"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          elif [ "$BAT" = "success" ]; then
            echo "✅ BAT gate PASSED — deploying preview and running Smoke tests"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ BAT gate FAILED (bat=$BAT) — blocking downstream"
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post BAT gate decision to Slack
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          PASSED="${{ steps.evaluate.outputs.passed }}"
          TS="${{ needs.notify-start.outputs.thread_ts }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$PASSED" = "true" ]; then
            ICON="✅"; MSG="BAT gate *PASSED* — deploying preview, running Smoke tests…"
          else
            ICON="🚫"; MSG="BAT gate *FAILED* — Smoke & Regression tests *BLOCKED*."
          fi
          python3 - <<EOF
          import json, pathlib
          blocks = [
            {"type": "section", "text": {"type": "mrkdwn", "text": "$ICON $MSG"}},
            {"type": "context", "elements": [{"type": "mrkdwn", "text": "Build #${{ github.run_number }} · <$RUN_URL|View run>"}]}
          ]
          payload = {"channel": "${{ secrets.SLACK_CHANNEL_ID }}", "thread_ts": "$TS",
                     "unfurl_links": False, "unfurl_media": False, "blocks": blocks}
          pathlib.Path("bat-gate-payload.json").write_text(json.dumps(payload))
          EOF
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @bat-gate-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# 6. DEPLOY PREVIEW — Firebase Hosting preview channel
# ─────────────────────────────────────────────────────────────────────────────
  deploy-preview:
    name: "Deploy Firebase Preview"
    runs-on: ubuntu-latest
    needs: [notify-start, build, bat-gate]
    if: always() && needs.bat-gate.outputs.passed == 'true' && needs.build.result == 'success'
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
      channel:     ${{ steps.deploy.outputs.channel }}
      thread_ts:   ${{ needs.notify-start.outputs.thread_ts }}

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-player/dist

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to preview channel
        id: deploy
        if: env.FIREBASE_TOKEN != '' && env.FIREBASE_PROJECT_ID != ''
        run: |
          CHANNEL="build-${{ github.run_number }}"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          OUTPUT=$(firebase hosting:channel:deploy "$CHANNEL" \
            --expires 2h \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --json 2>/dev/null || echo '{}')
          echo "Firebase output: $OUTPUT"
          URL=$(echo "$OUTPUT" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          vals = list(d.get('result', {}).values())
          print(vals[0].get('url', '') if vals else '')
          " 2>/dev/null || echo '')
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "✅ Preview deployed: $URL"
        working-directory: web-player
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Set placeholder URL when Firebase not configured
        if: env.FIREBASE_TOKEN == '' || env.FIREBASE_PROJECT_ID == ''
        run: |
          echo "preview_url=http://localhost:3000" >> "$GITHUB_OUTPUT"
          echo "channel=local" >> "$GITHUB_OUTPUT"

      - name: Post preview deploy result to Slack thread
        if: always()
        env:
          MODULE_NAME: WEB
          STAGE_NAME: Firebase Preview Deploy
          STAGE_RESULT: ${{ steps.deploy.outcome || 'skipped' }}
          REPORT_URL: ${{ steps.deploy.outputs.preview_url }}
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send preview deploy Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# 7. SMOKE TESTS — @Smoke Playwright tests; 3 workers; runs after BAT gate
# ─────────────────────────────────────────────────────────────────────────────
  smoke-tests:
    name: "Smoke Tests"
    runs-on: ubuntu-latest
    needs: [notify-start, bat-gate, deploy-preview]
    if: needs.bat-gate.outputs.passed == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-player/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web-player

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web-player

      - name: Record Smoke start time
        run: echo "SMOKE_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run Smoke tests (@Smoke, 3 workers)
        id: smoke
        continue-on-error: true
        run: npm run e2e:smoke
        working-directory: web-player
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-preview.outputs.preview_url || 'http://localhost:3000' }}

      - name: Calculate Smoke duration
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - ${SMOKE_START:-0} ))
          MINS=$(( ELAPSED / 60 )); SECS=$(( ELAPSED % 60 ))
          [ $MINS -gt 0 ] && DUR="${MINS}m $(printf '%02d' $SECS)s" || DUR="${SECS}s"
          echo "SMOKE_DURATION=$DUR" >> "$GITHUB_ENV"

      - name: Upload Smoke Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-playwright-report
          path: web-player/playwright-report/smoke/
          retention-days: 14

      - name: Upload Smoke Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web-smoke
          path: web-player/allure-results/smoke
          retention-days: 14

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Smoke Allure report
        if: always()
        run: |
          mkdir -p stage-allure-report
          echo "<html><head><title>Web Smoke</title></head><body><h2>No Smoke results for run ${{ github.run_number }}.</h2></body></html>" \
            > stage-allure-report/index.html
          SRC="web-player/allure-results/smoke"
          if [ -d "$SRC" ] && [ "$(ls -A "$SRC" 2>/dev/null)" ]; then
            allure generate "$SRC" -o stage-allure-report --clean \
              && echo "✅ Smoke Allure report generated" \
              || echo "⚠️ Generation failed — placeholder kept"
          fi

      - name: Deploy Smoke Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./stage-allure-report
          destination_dir: allure/${{ github.run_number }}/web/smoke
          keep_files: true

      - name: Post Smoke result to Slack thread
        if: always()
        env:
          MODULE_NAME: WEB
          STAGE_NAME: Smoke Tests
          PLAYWRIGHT_JSON: web-player/playwright-results-smoke.json
          STAGE_RESULT: ${{ steps.smoke.outcome }}
          DURATION: ${{ env.SMOKE_DURATION }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_number }}/web/smoke
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send Smoke Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

      - name: Fail if Smoke tests failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# 8. REGRESSION TESTS — @Regression; 2 workers; non-blocking; always runs after Smoke
# ─────────────────────────────────────────────────────────────────────────────
  regression-tests:
    name: "Regression Tests (Network Throttle)"
    runs-on: ubuntu-latest
    needs: [notify-start, bat-gate, smoke-tests]
    if: needs.bat-gate.outputs.passed == 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-player/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web-player

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web-player

      - name: Record Regression start time
        run: echo "REG_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run Regression tests (@Regression, 2 workers)
        id: regression
        continue-on-error: true
        run: npm run e2e:regression
        working-directory: web-player
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-preview.outputs.preview_url || 'http://localhost:3000' }}

      - name: Calculate Regression duration
        if: always()
        run: |
          ELAPSED=$(( $(date +%s) - ${REG_START:-0} ))
          MINS=$(( ELAPSED / 60 )); SECS=$(( ELAPSED % 60 ))
          [ $MINS -gt 0 ] && DUR="${MINS}m $(printf '%02d' $SECS)s" || DUR="${SECS}s"
          echo "REG_DURATION=$DUR" >> "$GITHUB_ENV"

      - name: Upload Regression Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-regression-playwright-report
          path: web-player/playwright-report/regression/
          retention-days: 14

      - name: Upload Regression Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web-regression
          path: web-player/allure-results/regression
          retention-days: 14

      - name: Install Allure CLI
        if: always()
        run: npm install -g allure-commandline

      - name: Generate Regression Allure report
        if: always()
        run: |
          mkdir -p stage-allure-report
          echo "<html><head><title>Web Regression</title></head><body><h2>No Regression results for run ${{ github.run_number }}.</h2></body></html>" \
            > stage-allure-report/index.html
          SRC="web-player/allure-results/regression"
          if [ -d "$SRC" ] && [ "$(ls -A "$SRC" 2>/dev/null)" ]; then
            allure generate "$SRC" -o stage-allure-report --clean \
              && echo "✅ Regression Allure report generated" \
              || echo "⚠️ Generation failed — placeholder kept"
          fi

      - name: Deploy Regression Allure report to GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./stage-allure-report
          destination_dir: allure/${{ github.run_number }}/web/regression
          keep_files: true

      - name: Post Regression result to Slack thread
        if: always()
        env:
          MODULE_NAME: WEB
          STAGE_NAME: Regression Tests
          PLAYWRIGHT_JSON: web-player/playwright-results-regression.json
          STAGE_RESULT: ${{ steps.regression.outcome }}
          DURATION: ${{ env.REG_DURATION }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_number }}/web/regression
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send Regression Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# 9. PROMOTE LIVE — only when Smoke passes
# ─────────────────────────────────────────────────────────────────────────────
  promote-live:
    name: "Promote to Live"
    runs-on: ubuntu-latest
    needs: [notify-start, deploy-preview, smoke-tests]
    if: always() && needs.smoke-tests.result == 'success' && needs.deploy-preview.result == 'success'

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Promote preview to live channel
        id: promote
        if: env.FIREBASE_TOKEN != '' && env.FIREBASE_PROJECT_ID != ''
        run: |
          PROJECT="${{ secrets.FIREBASE_PROJECT_ID }}"
          CHANNEL="${{ needs.deploy-preview.outputs.channel }}"
          firebase hosting:clone "$PROJECT:$CHANNEL" "$PROJECT:live" \
            --project "$PROJECT" --token "${{ secrets.FIREBASE_TOKEN }}"
          firebase hosting:channel:delete "$CHANNEL" --force \
            --project "$PROJECT" --token "${{ secrets.FIREBASE_TOKEN }}" || true
          echo "🚀 Promoted build-${{ github.run_number }} to live"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Post promote result to Slack thread
        if: always()
        env:
          MODULE_NAME: WEB
          STAGE_NAME: Firebase Live Promotion
          STAGE_RESULT: ${{ steps.promote.outcome || 'skipped' }}
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send promote Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# 10. ROLLBACK PREVIEW — delete preview when Smoke fails; live is untouched
# ─────────────────────────────────────────────────────────────────────────────
  rollback-preview:
    name: "Rollback Preview"
    runs-on: ubuntu-latest
    needs: [notify-start, deploy-preview, smoke-tests]
    if: always() && needs.deploy-preview.result == 'success' && needs.smoke-tests.result != 'success'

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Delete failed preview channel
        if: env.FIREBASE_TOKEN != '' && env.FIREBASE_PROJECT_ID != ''
        run: |
          CHANNEL="${{ needs.deploy-preview.outputs.channel }}"
          firebase hosting:channel:delete "$CHANNEL" --force \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}" || true
          echo "🔄 Preview channel deleted — live channel is unchanged"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Post rollback to Slack thread
        if: always()
        env:
          MODULE_NAME: WEB
          STAGE_NAME: "Preview Rolled Back (live unchanged)"
          STAGE_RESULT: failure
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send rollback Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# 11. REPORT — final pipeline summary + Slack overall result
# ─────────────────────────────────────────────────────────────────────────────
  report:
    name: "Report & Slack Summary"
    runs-on: ubuntu-latest
    needs:
      - notify-start
      - build
      - unit-tests
      - unit-gate
      - bat-tests
      - bat-gate
      - deploy-preview
      - smoke-tests
      - regression-tests
      - promote-live
      - rollback-preview
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Calculate total pipeline duration
        run: |
          START_EPOCH="${{ needs.notify-start.outputs.start_epoch }}"
          NOW=$(date +%s)
          ELAPSED=$(( NOW - START_EPOCH ))
          MINS=$(( ELAPSED / 60 )); SECS=$(( ELAPSED % 60 ))
          [ $MINS -gt 0 ] && DUR="${MINS}m ${SECS}s" || DUR="${SECS}s"
          echo "TOTAL_DURATION=$DUR" >> "$GITHUB_ENV"

      - name: GitHub Step Summary
        run: |
          echo "## 🌐 Web Player Pipeline — Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests (Vitest) | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Gate (≥80%) | ${{ needs.unit-gate.outputs.passed == 'true' && 'passed' || 'failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| BAT Tests | ${{ needs.bat-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| BAT Gate | ${{ needs.bat-gate.outputs.passed == 'true' && 'passed' || 'failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase Preview | ${{ needs.deploy-preview.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | ${{ needs.smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression Tests | ${{ needs.regression-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase Live | ${{ needs.promote-live.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\` | **Commit:** \`${{ github.sha }}\` | **Duration:** ${{ env.TOTAL_DURATION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Allure Reports (GitHub Pages)" >> $GITHUB_STEP_SUMMARY
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_number }}/web"
          echo "- [Unit]($BASE/unit) | [BAT]($BASE/bat) | [Smoke]($BASE/smoke) | [Regression]($BASE/regression)" >> $GITHUB_STEP_SUMMARY

      - name: Build final Slack summary payload
        if: always()
        env:
          MODULE_NAME: WEB
          STAGE1_NAME: Build
          STAGE1_RESULT: ${{ needs.build.result }}
          STAGE2_NAME: Unit Tests (Vitest)
          STAGE2_RESULT: ${{ needs.unit-tests.result }}
          STAGE3_NAME: "Unit Gate (≥80%)"
          STAGE3_RESULT: ${{ needs.unit-gate.outputs.passed == 'true' && 'success' || 'failure' }}
          STAGE4_NAME: BAT Tests
          STAGE4_RESULT: ${{ needs.bat-tests.result }}
          STAGE5_NAME: BAT Gate
          STAGE5_RESULT: ${{ needs.bat-gate.outputs.passed == 'true' && 'success' || 'failure' }}
          STAGE6_NAME: Smoke Tests
          STAGE6_RESULT: ${{ needs.smoke-tests.result }}
          STAGE7_NAME: Regression Tests
          STAGE7_RESULT: ${{ needs.regression-tests.result }}
          STAGE8_NAME: Firebase Live
          STAGE8_RESULT: ${{ needs.promote-live.result }}
          TOTAL_DURATION: ${{ env.TOTAL_DURATION }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          WORKFLOW_START_EPOCH: ${{ needs.notify-start.outputs.start_epoch }}
        run: python3 .github/scripts/module_result_to_slack.py

      - name: Inject thread_ts into summary payload
        if: always() && needs.notify-start.outputs.thread_ts != ''
        run: |
          python3 - <<'EOF'
          import json, pathlib
          ts = "${{ needs.notify-start.outputs.thread_ts }}"
          p = json.loads(pathlib.Path("module-slack-payload.json").read_text())
          p["thread_ts"] = ts
          pathlib.Path("module-slack-payload.json").write_text(json.dumps(p))
          EOF

      - name: Send overall summary Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./module-slack-payload.json

      - name: Fail pipeline if critical stage failed
        if: |
          needs.build.result == 'failure' ||
          needs.unit-tests.result == 'failure' ||
          needs.unit-gate.outputs.passed == 'false' ||
          needs.bat-tests.result == 'failure' ||
          needs.smoke-tests.result == 'failure'
        run: exit 1
