name: QoE Web Player Tests

on:
  pull_request:
    paths:
      - 'web-player/**'
      - '.github/workflows/qoe-web-tests.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'web-player/**'
  workflow_dispatch:

jobs:
  test:
    name: Web Player Tests
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
        working-directory: web-player
      
      - name: Run linter
        run: npm run lint
        working-directory: web-player
      
      - name: Run tests
        run: npm test
        working-directory: web-player
      
      - name: Build
        run: npm run build
        working-directory: web-player

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web-player

      - name: End-to-end QoE gates
        run: npm run e2e
        working-directory: web-player
      
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: web-player/coverage/
