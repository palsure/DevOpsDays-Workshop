# QoE Web Player Pipeline
#
# Stages:
#   0. notify-start    — post "build started" to Slack; capture thread ts + start epoch
#   1. unit-tests      — Vitest + lint + build → post result to Slack thread
#   2. e2e-tests       — Playwright QoE gate tests → post result to Slack thread
#   3. automation-e2e  — Maven system tests against live backend → post result to Slack thread
#   4. report          — Final summary + Slack overall result

name: Stream-QoE-App-Web

on:
  pull_request:
    paths:
      - 'web-player/**'
      - '.github/workflows/qoe-web-tests.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'web-player/**'
      - '.github/workflows/qoe-web-tests.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests and force-publish to Firebase (hotfix mode)'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Target environment (STAGE / PROD)'
        required: false
        default: 'STAGE'

env:
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 0 — Notify Start
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  notify-start:
    name: Notify — build started
    runs-on: ubuntu-latest
    outputs:
      thread_ts:   ${{ steps.post.outputs.thread_ts }}
      start_epoch: ${{ steps.ts.outputs.start_epoch }}

    steps:
      - name: Record start time
        id: ts
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Post "build started" to Slack
        id: post
        if: env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(python3 - <<EOF
          import json
          blocks = [
            {"type": "header", "text": {"type": "plain_text", "text": "[WEB] Build — Started  |  Build #${{ github.run_number }}", "emoji": True}},
            {"type": "section", "fields": [
              {"type": "mrkdwn", "text": "*Branch:*\n\`${{ github.ref_name }}\`"},
              {"type": "mrkdwn", "text": "*Commit:*\n<$COMMIT_URL|${SHORT_SHA}>"},
              {"type": "mrkdwn", "text": "*Triggered by:*\n${{ github.actor }} (${{ github.event_name }})"},
            ]},
            {"type": "divider"},
            {"type": "context", "elements": [{"type": "mrkdwn", "text": "⏳ Unit tests running… results will follow in this thread."}]},
            {"type": "actions", "elements": [{"type": "button", "text": {"type": "plain_text", "text": "View Run", "emoji": True}, "url": "$RUN_URL", "style": "primary"}]}
          ]
          print(json.dumps({"channel": "${{ env.SLACK_CHANNEL_ID }}", "unfurl_links": False, "unfurl_media": False, "blocks": blocks}))
          EOF
          )

          RESPONSE=$(curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Slack response: $RESPONSE"
          TS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ts',''))")
          echo "thread_ts=$TS" >> "$GITHUB_OUTPUT"

      - name: Set empty thread_ts when Slack not configured
        if: env.SLACK_BOT_TOKEN == '' || env.SLACK_CHANNEL_ID == ''
        run: echo "thread_ts=" >> "$GITHUB_OUTPUT"

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — Build (always runs; produces the deployable dist/ artifact)
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "Stage 1 — Build"
    runs-on: ubuntu-latest
    needs: notify-start

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web-player/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web-player

      - name: Build
        run: npm run build
        working-directory: web-player

      - name: Upload build artifact (dist/)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-player/dist/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — Unit Tests + Slack thread reply
# ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: "Stage 2 — Unit Tests (Vitest)"
    runs-on: ubuntu-latest
    needs: [notify-start, build]
    if: inputs.skip_tests != true && needs.build.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web-player/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web-player

      - name: Lint
        run: npm run lint
        working-directory: web-player

      - name: Unit tests (Vitest)
        id: unit
        run: npm test
        working-directory: web-player
        continue-on-error: true

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-unit-test-results
          path: web-player/test-results/
          retention-days: 7

      - name: Post unit test result to Slack thread
        if: always()
        env:
          MODULE_NAME: WEB
          STAGE_NAME: Unit Tests (Vitest)
          JUNIT_DIR: web-player/test-results
          STAGE_RESULT: ${{ steps.unit.outcome }}
          REPORT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send unit test Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./stage-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Fail if unit tests failed
        if: steps.unit.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — E2E Tests (Playwright) + Slack thread reply
# ─────────────────────────────────────────────────────────────────────────────
  e2e-tests:
    name: "Stage 3 — E2E Tests (Playwright)"
    runs-on: ubuntu-latest
    needs: [notify-start, unit-tests]
    if: inputs.skip_tests != true && needs.unit-tests.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web-player/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web-player

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web-player

      - name: Run E2E QoE gate tests
        id: e2e
        run: npm run e2e
        working-directory: web-player
        continue-on-error: true

      - name: Generate Allure report
        if: always()
        run: |
          if [ -d allure-results ] && [ "$(ls -A allure-results 2>/dev/null)" ]; then
            npx allure generate allure-results --clean -o allure-report || true
          fi
        working-directory: web-player

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-playwright-report
          path: web-player/playwright-report/
          retention-days: 14

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-allure-report
          path: web-player/allure-report/
          retention-days: 14

      - name: Post E2E result to Slack thread
        if: always()
        env:
          MODULE_NAME: WEB
          STAGE_NAME: E2E Tests (Playwright)
          PLAYWRIGHT_JSON: web-player/playwright-results.json
          STAGE_RESULT: ${{ steps.e2e.outcome }}
          REPORT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send E2E Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./stage-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Fail if E2E tests failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — Automation E2E + Slack thread reply
# ─────────────────────────────────────────────────────────────────────────────
  automation-e2e:
    name: "Stage 4 — Acceptance Tests"
    runs-on: ubuntu-latest
    needs: [notify-start, e2e-tests]
    if: inputs.skip_tests != true && needs.e2e-tests.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Start backend stack (Docker Compose)
        run: docker compose up -d postgres backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "backend is up"; exit 0
            fi
            echo "waiting… ($i/36)"; sleep 5
          done
          docker compose logs backend; exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('qoe-automation-tests/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Run automation E2E tests
        id: auto_e2e
        continue-on-error: true
        run: mvn -B test -Dapi.base.url=http://localhost:8080
        working-directory: qoe-automation-tests

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-automation-surefire
          path: qoe-automation-tests/target/surefire-reports/
          retention-days: 14

      - name: Generate Allure HTML report
        if: always()
        run: mvn --no-transfer-progress allure:report -q
        working-directory: qoe-automation-tests
        continue-on-error: true

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-acceptance-allure-report
          path: qoe-automation-tests/target/allure-report/
          retention-days: 14

      - name: Tear down Docker stack
        if: always()
        run: docker compose down -v || true

      - name: Post automation E2E result to Slack thread
        if: always()
        env:
          MODULE_NAME: WEB
          STAGE_NAME: Acceptance Tests
          JUNIT_DIR: qoe-automation-tests/target/surefire-reports
          STAGE_RESULT: ${{ steps.auto_e2e.outcome }}
          REPORT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send automation E2E Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./stage-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Fail if automation tests failed
        if: steps.auto_e2e.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4 — Final summary + Slack overall result
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# STAGE 5 — Quality Gate
# ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: "Stage 5 — Quality Gate"
    runs-on: ubuntu-latest
    needs: [notify-start, build, unit-tests, e2e-tests, automation-e2e]
    if: always() && needs.build.result == 'success'
    outputs:
      passed: ${{ steps.check.outputs.passed }}

    steps:
      - id: check
        name: Evaluate quality gate
        run: |
          SKIP="${{ inputs.skip_tests }}"
          UNIT="${{ needs.unit-tests.result }}"
          E2E="${{ needs.e2e-tests.result }}"
          ACCEPT="${{ needs.automation-e2e.result }}"

          if [ "$SKIP" = "true" ]; then
            echo "⚡ Force-publish mode — tests skipped, gate bypassed"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          elif [ "$UNIT" = "success" ] && [ "$E2E" = "success" ] && [ "$ACCEPT" = "success" ]; then
            echo "✅ Quality gate PASSED"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Quality gate FAILED (unit=$UNIT, e2e=$E2E, acceptance=$ACCEPT)"
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 6a — Deploy to Firebase Hosting PREVIEW channel (not live yet)
# The preview URL is a temporary isolated deployment; live channel is untouched.
# Requires: FIREBASE_TOKEN, FIREBASE_PROJECT_ID secrets.
# ─────────────────────────────────────────────────────────────────────────────
  deploy-preview:
    name: "Stage 6a — Deploy Firebase Preview"
    runs-on: ubuntu-latest
    needs: [notify-start, build, quality-gate]
    if: always() && needs.quality-gate.outputs.passed == 'true' && needs.build.result == 'success'
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
      channel: ${{ steps.deploy.outputs.channel }}

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-player/dist

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to preview channel
        id: deploy
        if: env.FIREBASE_TOKEN != '' && env.FIREBASE_PROJECT_ID != ''
        run: |
          CHANNEL="build-${{ github.run_number }}"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

          OUTPUT=$(firebase hosting:channel:deploy "$CHANNEL" \
            --expires 2h \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --json 2>/dev/null || echo '{}')

          echo "Firebase output: $OUTPUT"

          URL=$(echo "$OUTPUT" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          vals = list(d.get('result', {}).values())
          print(vals[0].get('url', '') if vals else '')
          " 2>/dev/null || echo '')

          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "✅ Preview deployed: $URL"
        working-directory: web-player
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Post preview deploy result to Slack thread
        if: always()
        env:
          MODULE_NAME: WEB
          STAGE_NAME: Firebase Preview Deploy
          STAGE_RESULT: ${{ steps.deploy.outcome || 'skipped' }}
          REPORT_URL: ${{ steps.deploy.outputs.preview_url }}
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send preview deploy Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./stage-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 6b — Run E2E tests against the preview URL
# Uses the same Playwright suite but pointed at the live preview channel.
# If PLAYWRIGHT_BASE_URL is set, playwright.config.ts skips the local server.
# ─────────────────────────────────────────────────────────────────────────────
  test-on-preview:
    name: "Stage 6b — E2E on Preview URL"
    runs-on: ubuntu-latest
    needs: [notify-start, deploy-preview]
    if: always() && needs.deploy-preview.result == 'success' && needs.deploy-preview.outputs.preview_url != ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: web-player/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web-player

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web-player

      - name: Run E2E tests against preview URL
        id: e2e_preview
        run: npm run e2e
        working-directory: web-player
        continue-on-error: true
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy-preview.outputs.preview_url }}
          CI: 'true'

      - name: Upload Playwright preview report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-preview-playwright-report
          path: web-player/playwright-report/
          retention-days: 7

      - name: Post preview E2E result to Slack thread
        if: always()
        env:
          MODULE_NAME: WEB
          STAGE_NAME: E2E on Preview (Firebase)
          PLAYWRIGHT_JSON: web-player/playwright-results.json
          STAGE_RESULT: ${{ steps.e2e_preview.outcome }}
          REPORT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send preview E2E Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./stage-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Fail if E2E on preview failed
        if: steps.e2e_preview.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 6c — Promote preview to LIVE  (only if preview E2E passed)
# Clones the preview channel to the live channel, then removes the preview.
# ─────────────────────────────────────────────────────────────────────────────
  promote-live:
    name: "Stage 6c — Promote to Live ✅"
    runs-on: ubuntu-latest
    needs: [notify-start, deploy-preview, test-on-preview]
    if: always() && needs.test-on-preview.result == 'success' && needs.deploy-preview.result == 'success'

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Promote preview to live channel
        id: promote
        if: env.FIREBASE_TOKEN != '' && env.FIREBASE_PROJECT_ID != ''
        run: |
          PROJECT="${{ secrets.FIREBASE_PROJECT_ID }}"
          CHANNEL="${{ needs.deploy-preview.outputs.channel }}"

          firebase hosting:clone "$PROJECT:$CHANNEL" "$PROJECT:live" \
            --project "$PROJECT" \
            --token "${{ secrets.FIREBASE_TOKEN }}"

          firebase hosting:channel:delete "$CHANNEL" --force \
            --project "$PROJECT" \
            --token "${{ secrets.FIREBASE_TOKEN }}" || true

          echo "🚀 Promoted build-${{ github.run_number }} to live"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Post promote result to Slack thread
        if: always()
        env:
          MODULE_NAME: WEB
          STAGE_NAME: Firebase Live Promotion
          STAGE_RESULT: ${{ steps.promote.outcome || 'skipped' }}
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send promote Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./stage-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 6c (alt) — Delete preview on failure  (live channel is untouched)
# ─────────────────────────────────────────────────────────────────────────────
  rollback-preview:
    name: "Stage 6c — Rollback Preview ❌"
    runs-on: ubuntu-latest
    needs: [notify-start, deploy-preview, test-on-preview]
    if: always() && needs.deploy-preview.result == 'success' && needs.test-on-preview.result != 'success'

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Delete failed preview channel
        if: env.FIREBASE_TOKEN != '' && env.FIREBASE_PROJECT_ID != ''
        run: |
          CHANNEL="${{ needs.deploy-preview.outputs.channel }}"
          firebase hosting:channel:delete "$CHANNEL" --force \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}" || true
          echo "🔄 Preview channel deleted — live channel is unchanged"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Post rollback to Slack thread
        if: always()
        env:
          MODULE_NAME: WEB
          STAGE_NAME: "Preview Rolled Back (live unchanged)"
          STAGE_RESULT: failure
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send rollback Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./stage-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 7 — Final summary + Slack overall result
# ─────────────────────────────────────────────────────────────────────────────
  report:
    name: "Stage 7 — Report & Slack Summary"
    runs-on: ubuntu-latest
    needs: [notify-start, build, unit-tests, e2e-tests, automation-e2e, quality-gate, deploy-preview, test-on-preview, promote-live, rollback-preview]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Pipeline summary
        run: |
          echo "## Web Player Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests (Vitest) | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests (Playwright) | ${{ needs.e2e-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Acceptance Tests | ${{ needs.automation-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Gate | ${{ needs.quality-gate.result }} (${{ needs.quality-gate.outputs.passed }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase Preview  | ${{ needs.deploy-preview.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase Live     | ${{ needs.promote-live.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`  |  **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Build Slack overall summary payload
        if: always()
        env:
          MODULE_NAME: WEB
          STAGE1_NAME: Build
          STAGE1_RESULT: ${{ needs.build.result }}
          STAGE2_NAME: Unit Tests (Vitest)
          STAGE2_RESULT: ${{ needs.unit-tests.result }}
          STAGE3_NAME: E2E Tests (Playwright)
          STAGE3_RESULT: ${{ needs.e2e-tests.result }}
          STAGE4_NAME: Acceptance Tests
          STAGE4_RESULT: ${{ needs.automation-e2e.result }}
          STAGE5_NAME: Firebase Preview
          STAGE5_RESULT: ${{ needs.deploy-preview.result }}
          STAGE6_NAME: Firebase Live
          STAGE6_RESULT: ${{ needs.promote-live.result }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          WORKFLOW_START_EPOCH: ${{ needs.notify-start.outputs.start_epoch }}
        run: python3 .github/scripts/module_result_to_slack.py

      - name: Inject thread_ts into summary payload
        if: always() && needs.notify-start.outputs.thread_ts != ''
        run: |
          python3 - <<'EOF'
          import json, pathlib
          ts = "${{ needs.notify-start.outputs.thread_ts }}"
          p = json.loads(pathlib.Path("module-slack-payload.json").read_text())
          p["thread_ts"] = ts
          pathlib.Path("module-slack-payload.json").write_text(json.dumps(p))
          EOF

      - name: Send overall summary Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./module-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Fail pipeline if any critical stage failed
        if: |
          needs.build.result == 'failure' ||
          needs.unit-tests.result == 'failure' ||
          needs.e2e-tests.result == 'failure' ||
          needs.automation-e2e.result == 'failure'
        run: exit 1
