# Stream-QoE-App-Web
#
# Pipeline flow:
#   0. notify-start    — Post "build started" to Slack; capture thread_ts + start_epoch.
#   1. build  ┐        — tsc + vite build; produces deployable dist/ artifact.
#   2. unit   ┘        — Both run IN PARALLEL (fail-fast). Vitest gate (≥80%) inlined.
#   3. bat-tests       — @BAT Playwright tests (4 workers). Gate inlined.
#                        Waits for BOTH build AND unit-tests gate to pass.
#   4. deploy-preview  — Firebase preview channel deployed after BAT gate passes.
#   5. promote-live    — Promotes preview → live RIGHT AFTER BAT gate passes.
#                        Trusted deployment: BAT is sufficient for promotion.
#   6. report  ──────  — Fires after promote-live. Pipeline marks complete here.
#   7. smoke-tests     — @Smoke tests against the LIVE URL. Async / non-blocking.
#                        Validates the promoted live deployment end-to-end.
#   8. rollback-live   — Runs when Smoke fails; notifies team to review live deploy.
#
# Required secrets (Slack steps are skipped when not set):
#   SLACK_BOT_TOKEN       — Slack bot OAuth token
#   SLACK_CHANNEL_ID      — Target Slack channel ID
# Optional secrets:
#   FIREBASE_TOKEN        — Firebase CI token (`firebase login:ci`)
#   FIREBASE_PROJECT_ID   — Firebase project ID

name: Stream-QoE-App-Web

on:
  pull_request:
    paths:
      - 'web-player/**'
      - '.github/workflows/qoe-web-tests.yml'
      - '.github/workflows/shared-notify-start.yml'
      - '.github/actions/**'
      - '.github/scripts/stage_result_to_slack.py'
      - '.github/scripts/module_result_to_slack.py'
  push:
    branches: [main, develop]
    paths:
      - 'web-player/**'
      - '.github/workflows/qoe-web-tests.yml'
      - '.github/workflows/shared-notify-start.yml'
      - '.github/actions/**'
      - '.github/scripts/stage_result_to_slack.py'
      - '.github/scripts/module_result_to_slack.py'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests and force-publish to Firebase (hotfix mode)'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Target environment (STAGE / PROD)'
        required: false
        default: 'STAGE'

permissions:
  contents: write
  pull-requests: write

env:
  QUALITY_GATE_THRESHOLD: '80'
  ENV_LABEL: ${{ github.event.inputs.environment || 'STAGE' }}
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# 0. NOTIFY START  (reusable workflow)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  notify-start:
    uses: ./.github/workflows/shared-notify-start.yml
    with:
      module-name:       WEB
      pipeline-steps:    "Build ∥ Unit → BAT → Deploy → Promote → Smoke (async)"
      environment-label: ${{ github.event.inputs.environment || 'STAGE' }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# 1. BUILD — tsc + vite build; produces deployable dist/ artifact
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "Build"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: notify-start

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-player/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web-player

      - name: Lint
        run: npm run lint
        working-directory: web-player

      - name: Build
        run: npm run build
        working-directory: web-player

      - name: Upload build artifact (dist/)
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web-player/dist/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# 2. UNIT TESTS — Vitest; fast pre-deploy gate; no browser required
# ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: "Unit Tests (Vitest)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [notify-start]
    if: inputs.skip_tests != true
    outputs:
      thread_ts:   ${{ needs.notify-start.outputs.thread_ts }}
      gate_passed: ${{ steps.unit-gate.outputs.gate_passed }}

    steps:
      - name: Record job start time
        run: echo "UNIT_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-player/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web-player

      - name: Run unit tests (Vitest)
        id: unit
        run: npm test
        working-directory: web-player
        env:
          CI: 'true'
          ALLURE_RESULTS_DIR: allure-results/unit

      - name: Calculate unit duration
        if: always()
        run: |
          if [ "${UNIT_START:-0}" -gt "0" ]; then
            ELAPSED=$(( $(date +%s) - UNIT_START ))
            MINS=$(( ELAPSED / 60 )); SECS=$(( ELAPSED % 60 ))
            [ $MINS -gt 0 ] && DUR="${MINS}m $(printf '%02d' $SECS)s" || DUR="${SECS}s"
            echo "UNIT_DURATION=$DUR" >> "$GITHUB_ENV"
          fi

      - name: Upload unit JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-unit-junit
          path: web-player/test-results/vitest-junit.xml
          retention-days: 14

      - name: Upload unit Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web-unit
          path: web-player/allure-results/unit
          retention-days: 14

      - name: Generate & deploy unit Allure report
        if: always()
        uses: ./.github/actions/publish-allure
        with:
          stage-title:        "Web Unit Tests"
          results-src:        web-player/allure-results/unit
          pages-destination:  allure/${{ github.run_number }}/web/unit
          github-token:       ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack — unit test result
        if: always()
        uses: ./.github/actions/slack-stage-notify
        with:
          module-name:     WEB
          stage-name:      "Unit Tests (Vitest)"
          stage-result:    ${{ steps.unit.outcome }}
          duration:        ${{ env.UNIT_DURATION }}
          report-url:      https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_number }}/web/unit
          thread-ts:       ${{ needs.notify-start.outputs.thread_ts }}
          junit-dir:       web-player/test-results
          slack-bot-token:  ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID }}

      - name: Evaluate unit quality gate (inline)
        id: unit-gate
        if: always()
        env:
          QUALITY_GATE_THRESHOLD: ${{ env.QUALITY_GATE_THRESHOLD }}
        run: |
          UNIT="${{ steps.unit.outcome }}"
          SKIP="${{ inputs.skip_tests }}"

          if [ "$SKIP" = "true" ]; then
            echo "⚡ Hotfix mode — unit gate bypassed"
            echo "gate_passed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if [ "$UNIT" != "success" ]; then
            echo "❌ Unit tests did not succeed (result=$UNIT) — gate FAILED"
            echo "gate_passed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          python3 - <<'EOF'
          import glob, xml.etree.ElementTree as ET, os
          files = glob.glob("web-player/test-results/**/*.xml", recursive=True)
          total = passed = failed = skipped = 0
          for f in files:
              root = ET.parse(f).getroot()
              suites = root.findall('testsuite') if root.tag == 'testsuites' else [root]
              for s in suites:
                  t  = int(s.attrib.get("tests",    0))
                  fa = int(s.attrib.get("failures", 0)) + int(s.attrib.get("errors", 0))
                  sk = int(s.attrib.get("skipped",  0))
                  total += t; failed += fa; skipped += sk; passed += max(0, t - fa - sk)

          threshold = float(os.environ.get("QUALITY_GATE_THRESHOLD", "80"))
          rate = (100.0 * passed / total) if total > 0 else 0.0
          gate_ok = rate >= threshold and failed == 0

          print(f"Unit gate: {passed}/{total} passed ({rate:.1f}%) — threshold {threshold}%")
          with open(os.environ["GITHUB_OUTPUT"], "a") as gh:
              gh.write(f"gate_passed={'true' if gate_ok else 'false'}\n")
          if not gate_ok:
              print(f"❌ FAILED — {rate:.1f}% < {threshold}% or {failed} test(s) failed")
          else:
              print(f"✅ PASSED — running BAT tests in parallel with Firebase deploy")
          EOF

      - name: Post unit gate decision to Slack
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          PASSED="${{ steps.unit-gate.outputs.gate_passed }}"
          TS="${{ needs.notify-start.outputs.thread_ts }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$PASSED" = "true" ]; then
            ICON="✅"; MSG="Unit gate *PASSED* — running BAT tests and Firebase deploy in parallel…"
          else
            ICON="🚫"; MSG="Unit gate *FAILED* — pass rate below ${{ env.QUALITY_GATE_THRESHOLD }}%. BAT tests *BLOCKED*."
          fi
          python3 - <<EOF
          import json, pathlib
          blocks = [
            {"type": "section", "text": {"type": "mrkdwn", "text": "$ICON $MSG"}},
            {"type": "context", "elements": [{"type": "mrkdwn", "text": "Build #${{ github.run_number }} · <$RUN_URL|View run>"}]}
          ]
          payload = {"channel": "${{ secrets.SLACK_CHANNEL_ID }}", "thread_ts": "$TS",
                     "unfurl_links": False, "unfurl_media": False, "blocks": blocks}
          pathlib.Path("unit-gate-payload.json").write_text(json.dumps(payload))
          EOF
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @unit-gate-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# 3. BAT TESTS — @BAT Playwright tests; 4 workers, 45 s timeout per test
#    Runs IN PARALLEL with deploy-preview (both unblocked by unit-tests gate)
# ─────────────────────────────────────────────────────────────────────────────
  bat-tests:
    name: "BAT — Build Acceptance Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [notify-start, build, unit-tests]
    if: inputs.skip_tests != true && needs.unit-tests.outputs.gate_passed == 'true' && needs.build.result == 'success'
    outputs:
      gate_passed: ${{ steps.bat-gate.outputs.gate_passed }}

    steps:
      - name: Record job start time
        run: echo "BAT_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-player/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web-player

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web-player

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-player/dist

      - name: Install static file server
        run: npm install -g serve

      - name: Serve dist/ on port 3000
        run: |
          serve web-player/dist -l 3000 &
          echo "SERVE_PID=$!" >> "$GITHUB_ENV"
          echo "Waiting for server on port 3000…"
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "✅ Server ready (attempt $i)"; exit 0
            fi
            sleep 1
          done
          echo "❌ Server not ready after 15s"; exit 1

      - name: Run BAT tests (@BAT, 4 workers)
        id: bat
        run: npm run e2e:bat
        working-directory: web-player
        env:
          CI: 'true'

      - name: Calculate BAT duration
        if: always()
        run: |
          if [ "${BAT_START:-0}" -gt "0" ]; then
            ELAPSED=$(( $(date +%s) - BAT_START ))
            MINS=$(( ELAPSED / 60 )); SECS=$(( ELAPSED % 60 ))
            [ $MINS -gt 0 ] && DUR="${MINS}m $(printf '%02d' $SECS)s" || DUR="${SECS}s"
            echo "BAT_DURATION=$DUR" >> "$GITHUB_ENV"
          fi

      - name: Stop dev server
        if: always()
        run: kill "$SERVE_PID" 2>/dev/null || true

      - name: Upload BAT Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-bat-playwright-report
          path: web-player/playwright-report/bat/
          retention-days: 14

      - name: Upload BAT Playwright JSON results
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: web-bat-playwright-json
          path: web-player/playwright-results-bat.json
          retention-days: 14

      - name: Upload BAT Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web-bat
          path: web-player/allure-results/bat
          retention-days: 14

      - name: Generate & deploy BAT Allure report
        if: always()
        uses: ./.github/actions/publish-allure
        with:
          stage-title:        "Web BAT"
          results-src:        web-player/allure-results/bat
          pages-destination:  allure/${{ github.run_number }}/web/bat
          github-token:       ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack — BAT result
        if: always()
        uses: ./.github/actions/slack-stage-notify
        with:
          module-name:     WEB
          stage-name:      "BAT (Build Acceptance Tests)"
          stage-result:    ${{ steps.bat.outcome }}
          duration:        ${{ env.BAT_DURATION }}
          report-url:      https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_number }}/web/bat
          thread-ts:       ${{ needs.notify-start.outputs.thread_ts }}
          playwright-json: web-player/playwright-results-bat.json
          slack-bot-token:  ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID }}

      - name: Evaluate BAT quality gate (inline)
        id: bat-gate
        if: always()
        run: |
          BAT="${{ steps.bat.outcome }}"
          SKIP="${{ inputs.skip_tests }}"

          if [ "$SKIP" = "true" ]; then
            echo "⚡ Hotfix mode — BAT gate bypassed"
            echo "gate_passed=true" >> "$GITHUB_OUTPUT"
          elif [ "$BAT" = "success" ]; then
            echo "✅ BAT gate PASSED — Smoke tests can start"
            echo "gate_passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ BAT gate FAILED (bat=$BAT) — blocking Smoke tests"
            echo "gate_passed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post BAT gate decision to Slack
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          PASSED="${{ steps.bat-gate.outputs.gate_passed }}"
          TS="${{ needs.notify-start.outputs.thread_ts }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$PASSED" = "true" ]; then
            ICON="✅"; MSG="BAT gate *PASSED* — running Smoke tests…"
          else
            ICON="🚫"; MSG="BAT gate *FAILED* — Smoke tests *BLOCKED*."
          fi
          python3 - <<EOF
          import json, pathlib
          blocks = [
            {"type": "section", "text": {"type": "mrkdwn", "text": "$ICON $MSG"}},
            {"type": "context", "elements": [{"type": "mrkdwn", "text": "Build #${{ github.run_number }} · <$RUN_URL|View run>"}]}
          ]
          payload = {"channel": "${{ secrets.SLACK_CHANNEL_ID }}", "thread_ts": "$TS",
                     "unfurl_links": False, "unfurl_media": False, "blocks": blocks}
          pathlib.Path("bat-gate-payload.json").write_text(json.dumps(payload))
          EOF
          curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d @bat-gate-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# 4. DEPLOY PREVIEW — Firebase Hosting preview channel (after BAT gate)
# ─────────────────────────────────────────────────────────────────────────────
  deploy-preview:
    name: "Deploy Firebase Preview"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [notify-start, build, bat-tests]
    if: always() && needs.bat-tests.outputs.gate_passed == 'true' && needs.build.result == 'success'
    outputs:
      preview_url: ${{ steps.resolve-url.outputs.preview_url }}
      channel:     ${{ steps.resolve-url.outputs.channel }}
      thread_ts:   ${{ needs.notify-start.outputs.thread_ts }}

    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-player/dist

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy to preview channel
        id: deploy
        if: env.FIREBASE_TOKEN != '' && env.FIREBASE_PROJECT_ID != ''
        run: |
          echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"
          CHANNEL="build-${{ github.run_number }}"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          # Capture stdout+stderr — Firebase prints the URL in human-readable lines
          # even with --json, so merging streams guarantees we can grep for it.
          OUTPUT=$(firebase hosting:channel:deploy "$CHANNEL" \
            --expires 2h \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --json 2>&1 || true)
          echo "=== Firebase deploy output ==="
          echo "$OUTPUT"
          echo "=============================="
          # Firebase preview URLs can end with .web.app or .firebaseapp.com
          URL=$(echo "$OUTPUT" | grep -oP 'https://[a-z0-9-]+--[a-z0-9-]+\.(web\.app|firebaseapp\.com)' | head -1 || true)
          # Second-pass grep: try without the double-dash pattern (some Firebase projects vary)
          if [ -z "$URL" ]; then
            URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9._-]+\.(web\.app|firebaseapp\.com)' | head -1 || true)
          fi
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "✅ Preview URL: ${URL:-<not extracted>}"
        working-directory: web-player
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Resolve preview URL
        id: resolve-url
        if: always()
        run: |
          URL="${{ steps.deploy.outputs.preview_url }}"
          CHANNEL="${{ steps.deploy.outputs.channel }}"
          if [ -z "$URL" ]; then
            URL="http://localhost:3000"
            CHANNEL="local-${{ github.run_number }}"
            echo "⚠️  Firebase URL not available — smoke tests will use localhost fallback"
          fi
          echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Resolved preview URL: $URL"

      - name: Calculate deploy duration
        if: always()
        run: |
          if [ "${DEPLOY_START:-0}" -gt "0" ]; then
            ELAPSED=$(( $(date +%s) - DEPLOY_START ))
            MINS=$(( ELAPSED / 60 )); SECS=$(( ELAPSED % 60 ))
            [ $MINS -gt 0 ] && DUR="${MINS}m $(printf '%02d' $SECS)s" || DUR="${SECS}s"
            echo "DEPLOY_DURATION=$DUR" >> "$GITHUB_ENV"
          fi

      - name: Notify Slack — preview deploy result
        if: always()
        uses: ./.github/actions/slack-stage-notify
        with:
          module-name:     WEB
          stage-name:      Firebase Preview Deploy
          stage-result:    ${{ steps.deploy.outcome || 'skipped' }}
          duration:        ${{ env.DEPLOY_DURATION }}
          report-url:      ${{ steps.resolve-url.outputs.preview_url }}
          link-label:      ":globe_with_meridians: Preview URL"
          thread-ts:       ${{ needs.notify-start.outputs.thread_ts }}
          slack-bot-token:  ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# 6. SMOKE TESTS — @Smoke Playwright tests; 3 workers; async (non-blocking)
#    Runs after deploy-preview; results delivered via Slack only.
# ─────────────────────────────────────────────────────────────────────────────
  smoke-tests:
    name: "Smoke Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [notify-start, promote-live, deploy-preview]
    if: needs.promote-live.result == 'success'
    continue-on-error: true

    steps:
      - name: Record job start time
        run: echo "SMOKE_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-player/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web-player

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: web-player

      - name: Download dist artifact (local server fallback)
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-player/dist

      - name: Install static file server
        run: npm install -g serve

      - name: Serve dist/ on port 3000 (fallback when Firebase URL unavailable)
        run: |
          serve -s dist -l 3000 &
          for i in $(seq 1 15); do
            curl -sf http://localhost:3000/ > /dev/null && echo "Local server ready" && break
            echo "Waiting for local server… ($i/15)"; sleep 2
          done
        working-directory: web-player

      - name: Run Smoke tests (@Smoke, 3 workers)
        id: smoke
        continue-on-error: true
        run: npm run e2e:smoke
        working-directory: web-player
        env:
          CI: 'true'
          PLAYWRIGHT_BASE_URL: ${{ needs.promote-live.outputs.live_url || needs.deploy-preview.outputs.preview_url || 'http://localhost:3000' }}

      - name: Calculate Smoke duration
        if: always()
        run: |
          if [ "${SMOKE_START:-0}" -gt "0" ]; then
            ELAPSED=$(( $(date +%s) - SMOKE_START ))
            MINS=$(( ELAPSED / 60 )); SECS=$(( ELAPSED % 60 ))
            [ $MINS -gt 0 ] && DUR="${MINS}m $(printf '%02d' $SECS)s" || DUR="${SECS}s"
            echo "SMOKE_DURATION=$DUR" >> "$GITHUB_ENV"
          fi

      - name: Upload Smoke Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-smoke-playwright-report
          path: web-player/playwright-report/smoke/
          retention-days: 14

      - name: Upload Smoke Playwright JSON results
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: web-smoke-playwright-json
          path: web-player/playwright-results-smoke.json
          retention-days: 14

      - name: Upload Smoke Allure raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-web-smoke
          path: web-player/allure-results/smoke
          retention-days: 14

      - name: Generate & deploy Smoke Allure report
        if: always()
        uses: ./.github/actions/publish-allure
        with:
          stage-title:        "Web Smoke"
          results-src:        web-player/allure-results/smoke
          pages-destination:  allure/${{ github.run_number }}/web/smoke
          github-token:       ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Slack — Smoke result
        if: always()
        uses: ./.github/actions/slack-stage-notify
        with:
          module-name:     WEB
          stage-name:      Smoke Tests
          stage-result:    ${{ steps.smoke.outcome }}
          duration:        ${{ env.SMOKE_DURATION }}
          report-url:      https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_number }}/web/smoke
          thread-ts:       ${{ needs.notify-start.outputs.thread_ts }}
          playwright-json: web-player/playwright-results-smoke.json
          slack-bot-token:  ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID }}

      - name: Fail if Smoke tests failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# 8. PROMOTE LIVE — right after BAT gate passes (before Smoke)
# ─────────────────────────────────────────────────────────────────────────────
  promote-live:
    name: "Promote to Live"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [notify-start, deploy-preview, bat-tests]
    if: always() && needs.bat-tests.outputs.gate_passed == 'true' && needs.deploy-preview.result == 'success'
    outputs:
      live_url: ${{ steps.promote.outputs.live_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Promote preview to live channel
        id: promote
        if: env.FIREBASE_TOKEN != '' && env.FIREBASE_PROJECT_ID != ''
        run: |
          PROJECT="${{ secrets.FIREBASE_PROJECT_ID }}"
          CHANNEL="${{ needs.deploy-preview.outputs.channel }}"
          firebase hosting:clone "$PROJECT:$CHANNEL" "$PROJECT:live" \
            --project "$PROJECT" --token "${{ secrets.FIREBASE_TOKEN }}"
          firebase hosting:channel:delete "$CHANNEL" --force \
            --project "$PROJECT" --token "${{ secrets.FIREBASE_TOKEN }}" || true
          echo "🚀 Promoted build-${{ github.run_number }} to live"
          echo "live_url=https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app" >> "$GITHUB_OUTPUT"
        working-directory: web-player
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Notify Slack — promote result
        if: always()
        uses: ./.github/actions/slack-stage-notify
        with:
          module-name:     WEB
          stage-name:      Firebase Live Promotion
          stage-result:    ${{ steps.promote.outcome || 'skipped' }}
          report-url:      ${{ steps.promote.outputs.live_url }}
          link-label:      ":rocket: Live URL"
          thread-ts:       ${{ needs.notify-start.outputs.thread_ts }}
          slack-bot-token:  ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# 10. ROLLBACK LIVE — notify + attempt rollback when Smoke fails on live
# ─────────────────────────────────────────────────────────────────────────────
  rollback-live:
    name: "Rollback Live"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [notify-start, promote-live, smoke-tests]
    if: always() && needs.promote-live.result == 'success' && needs.smoke-tests.result != 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Rollback live channel to previous deployment
        if: env.FIREBASE_TOKEN != '' && env.FIREBASE_PROJECT_ID != ''
        run: |
          echo "⚠️  Smoke tests failed on live — rolling back live channel"
          # Re-deploy previous stable artifact if available, otherwise alert team
          # Firebase preserves deployment history; the console can be used for manual rollback
          # In a full setup: restore artifact from previous run and re-deploy to live
          echo "🔄 Live rollback triggered — notify team to review https://${{ secrets.FIREBASE_PROJECT_ID }}.web.app"
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Notify Slack — live rollback
        if: always()
        uses: ./.github/actions/slack-stage-notify
        with:
          module-name:     WEB
          stage-name:      "Live Rollback (Smoke failed post-promote)"
          stage-result:    failure
          report-url:      ${{ needs.promote-live.outputs.live_url }}
          link-label:      ":rotating_light: Review Live"
          thread-ts:       ${{ needs.notify-start.outputs.thread_ts }}
          slack-bot-token:  ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel-id: ${{ secrets.SLACK_CHANNEL_ID }}

# ─────────────────────────────────────────────────────────────────────────────
# 11. REPORT — final pipeline summary + Slack overall result
# ─────────────────────────────────────────────────────────────────────────────
  report:
    name: "Report & Slack Summary"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - notify-start
      - build
      - unit-tests
      - bat-tests
      - deploy-preview
      - promote-live
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Calculate total pipeline duration
        run: |
          START_EPOCH="${{ needs.notify-start.outputs.start_epoch }}"
          NOW=$(date +%s)
          ELAPSED=$(( NOW - START_EPOCH ))
          MINS=$(( ELAPSED / 60 )); SECS=$(( ELAPSED % 60 ))
          [ $MINS -gt 0 ] && DUR="${MINS}m ${SECS}s" || DUR="${SECS}s"
          echo "TOTAL_DURATION=$DUR" >> "$GITHUB_ENV"

      - name: GitHub Step Summary
        run: |
          echo "## 🌐 Web Player Pipeline — Build #${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests (Vitest) | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Gate (≥80%) | ${{ needs.unit-tests.outputs.gate_passed == 'true' && 'passed' || 'failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| BAT Tests | ${{ needs.bat-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| BAT Gate | ${{ needs.bat-tests.outputs.gate_passed == 'true' && 'passed' || 'failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase Preview | ${{ needs.deploy-preview.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase Live Promotion | ${{ needs.promote-live.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Tests | async (validating live) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.head_ref || github.ref_name }}\` | **Commit:** \`${{ github.sha }}\` | **Duration:** ${{ env.TOTAL_DURATION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Allure Reports (GitHub Pages)" >> $GITHUB_STEP_SUMMARY
          BASE="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_number }}/web"
          echo "- [Unit]($BASE/unit) | [BAT]($BASE/bat) | [Smoke]($BASE/smoke)" >> $GITHUB_STEP_SUMMARY

      - name: Build final Slack summary payload
        if: always()
        env:
          MODULE_NAME: WEB
          STAGE1_NAME: Build
          STAGE1_RESULT: ${{ needs.build.result }}
          STAGE2_NAME: Unit Tests (Vitest)
          STAGE2_RESULT: ${{ needs.unit-tests.result }}
          STAGE3_NAME: "Unit Gate (≥80%)"
          STAGE3_RESULT: ${{ needs.unit-tests.outputs.gate_passed == 'true' && 'success' || 'failure' }}
          STAGE4_NAME: BAT Tests
          STAGE4_RESULT: ${{ needs.bat-tests.result }}
          STAGE5_NAME: BAT Gate
          STAGE5_RESULT: ${{ needs.bat-tests.outputs.gate_passed == 'true' && 'success' || 'failure' }}
          STAGE6_NAME: Firebase Preview
          STAGE6_RESULT: ${{ needs.deploy-preview.result }}
          STAGE7_NAME: Firebase Live Promotion
          STAGE7_RESULT: ${{ needs.promote-live.result }}
          TOTAL_DURATION: ${{ env.TOTAL_DURATION }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.head_ref || github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          WORKFLOW_START_EPOCH: ${{ needs.notify-start.outputs.start_epoch }}
        run: python3 .github/scripts/module_result_to_slack.py

      - name: Inject thread_ts into summary payload
        if: always() && needs.notify-start.outputs.thread_ts != ''
        run: |
          python3 - <<'EOF'
          import json, pathlib
          ts = "${{ needs.notify-start.outputs.thread_ts }}"
          p = json.loads(pathlib.Path("module-slack-payload.json").read_text())
          p["thread_ts"] = ts
          pathlib.Path("module-slack-payload.json").write_text(json.dumps(p))
          EOF

      - name: Send overall summary Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        continue-on-error: true
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./module-slack-payload.json

      - name: Update initial Slack message with build outcome
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        continue-on-error: true
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          MODULE_NAME: WEB
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          ENV_LABEL: ${{ env.ENV_LABEL }}
          BUILD_VERDICT: >-
            ${{ (needs.build.result == 'success' &&
                 needs.unit-tests.result != 'failure' &&
                 needs.unit-tests.outputs.gate_passed == 'true' &&
                 needs.bat-tests.outputs.gate_passed == 'true' &&
                 needs.deploy-preview.result == 'success') && 'success' || 'failure' }}
        run: python3 .github/scripts/update_build_message.py

      # ── PR comment with per-stage results + Allure links ──────────────────
      - name: Download unit JUnit results
        if: always() && github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-unit-junit
          path: artifacts/unit

      - name: Download BAT Playwright JSON results
        if: always() && github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-bat-playwright-json
          path: artifacts/bat

      - name: Download Smoke Playwright JSON results
        if: always() && github.event_name == 'pull_request'
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: web-smoke-playwright-json
          path: artifacts/smoke

      - name: Generate PR comment
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_REPOSITORY:  ${{ github.repository }}
          GITHUB_RUN_ID:      ${{ github.run_id }}
          GITHUB_RUN_NUMBER:  ${{ github.run_number }}
          GITHUB_SHA:         ${{ github.sha }}
          PR_NUMBER:          ${{ github.event.pull_request.number }}
          BRANCH_NAME:        ${{ github.head_ref }}
          STAGE_UNIT_RESULT:  ${{ needs.unit-tests.result }}
          STAGE_BAT_RESULT:   ${{ needs.bat-tests.result }}
          STAGE_SMOKE_RESULT: ${{ needs.smoke-tests.result }}
          BASE_PAGES_URL:     https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/allure/${{ github.run_number }}/web
        run: python3 .github/scripts/pr_summary_web.py

      - name: Post or update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs     = require('fs');
            const body   = fs.readFileSync('pr-comment-web.md', 'utf8');
            const MARKER = '<!-- qoe-web-results -->';

            const { data: comments } = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(MARKER));
            if (existing) {
              await github.rest.issues.updateComment({
                owner:      context.repo.owner,
                repo:       context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log('Updated PR comment', existing.id);
            } else {
              await github.rest.issues.createComment({
                owner:        context.repo.owner,
                repo:         context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log('Created PR comment');
            }

      - name: Fail pipeline if critical stage failed
        if: |
          needs.build.result == 'failure' ||
          needs.unit-tests.result == 'failure' ||
          needs.unit-tests.outputs.gate_passed == 'false' ||
          needs.bat-tests.result == 'failure' ||
          needs.deploy-preview.result == 'failure'
        run: exit 1
