# QoE Android Player Pipeline
#
# Stages:
#   0. notify-start    — post "build started" to Slack; capture thread ts + start epoch
#   1. unit-tests      — JVM unit tests → post result to Slack thread
#   2. lint            — Android lint (parallel with unit-tests)
#   3. build           — Assemble debug APK (only when unit-tests pass)
#   4. automation-e2e  — Maven system tests against live backend → post result to Slack thread
#   5. report          — Final summary + Slack overall result

name: Stream-QoE-App-Android

on:
  pull_request:
    paths:
      - 'android-player/**'
      - '.github/workflows/qoe-android-tests.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'android-player/**'
      - '.github/workflows/qoe-android-tests.yml'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests and force-publish to Firebase (hotfix mode)'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Target environment (STAGE / PROD)'
        required: false
        default: 'STAGE'

env:
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 0 — Notify Start
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  notify-start:
    name: Notify — build started
    runs-on: ubuntu-latest
    outputs:
      thread_ts:   ${{ steps.post.outputs.thread_ts }}
      start_epoch: ${{ steps.ts.outputs.start_epoch }}

    steps:
      - name: Record start time
        id: ts
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Post "build started" to Slack
        id: post
        if: env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(python3 - <<EOF
          import json
          blocks = [
            {"type": "header", "text": {"type": "plain_text", "text": "[ANDROID] Build — Started  |  Build #${{ github.run_number }}", "emoji": True}},
            {"type": "section", "fields": [
              {"type": "mrkdwn", "text": "*Branch:*\n\`${{ github.ref_name }}\`"},
              {"type": "mrkdwn", "text": "*Commit:*\n<$COMMIT_URL|${SHORT_SHA}>"},
              {"type": "mrkdwn", "text": "*Triggered by:*\n${{ github.actor }} (${{ github.event_name }})"},
            ]},
            {"type": "divider"},
            {"type": "context", "elements": [{"type": "mrkdwn", "text": "⏳ Unit tests & lint running… results will follow in this thread."}]},
            {"type": "actions", "elements": [{"type": "button", "text": {"type": "plain_text", "text": "View Run", "emoji": True}, "url": "$RUN_URL", "style": "primary"}]}
          ]
          print(json.dumps({"channel": "${{ env.SLACK_CHANNEL_ID }}", "unfurl_links": False, "unfurl_media": False, "blocks": blocks}))
          EOF
          )

          RESPONSE=$(curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Slack response: $RESPONSE"
          TS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ts',''))")
          echo "thread_ts=$TS" >> "$GITHUB_OUTPUT"

      - name: Set empty thread_ts when Slack not configured
        if: env.SLACK_BOT_TOKEN == '' || env.SLACK_CHANNEL_ID == ''
        run: echo "thread_ts=" >> "$GITHUB_OUTPUT"

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — Unit Tests + Slack thread reply
# ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: "Stage 1 — Unit Tests"
    runs-on: ubuntu-latest
    needs: notify-start
    if: inputs.skip_tests != true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v2
        continue-on-error: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android-player/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-android-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android-player

      - name: Run unit tests
        id: unit
        run: ./gradlew test --no-daemon
        working-directory: android-player
        continue-on-error: true

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: android-player/app/build/test-results/
          retention-days: 7

      - name: Upload unit test HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: android-player/app/build/reports/tests/
          retention-days: 7

      - name: Post unit test result to Slack thread
        if: always()
        env:
          MODULE_NAME: ANDROID
          STAGE_NAME: Unit Tests
          JUNIT_DIR: android-player/app/build/test-results/testDebugUnitTest
          STAGE_RESULT: ${{ steps.unit.outcome }}
          REPORT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send unit test Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

      - name: Fail if unit tests failed
        if: steps.unit.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1b — Lint (parallel with unit-tests, no Slack needed)
# ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: "Stage 1b — Lint"
    runs-on: ubuntu-latest
    needs: notify-start
    if: inputs.skip_tests != true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android-player/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-android-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android-player

      - name: Run lint
        run: ./gradlew lint --no-daemon
        working-directory: android-player
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android-player/app/build/reports/lint-results*.html
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — Build debug APK (only when unit tests pass)
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "Stage 2 — Build Debug APK"
    runs-on: ubuntu-latest
    needs: [notify-start, unit-tests, lint]
    # Run when tests pass (normal mode) OR when tests are skipped (force-publish mode).
    # 'skipped' is not 'failure', so this condition handles both cases.
    if: always() && needs.notify-start.result == 'success' && needs.unit-tests.result != 'failure' && needs.lint.result != 'failure'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android-player/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-android-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android-player

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android-player

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android-player/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — Automation E2E + Slack thread reply
# ─────────────────────────────────────────────────────────────────────────────
  automation-e2e:
    name: "Stage 3 — Acceptance Tests"
    runs-on: ubuntu-latest
    needs: [notify-start, build]
    if: inputs.skip_tests != true && needs.build.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Start backend stack (Docker Compose)
        run: docker compose up -d postgres backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "backend is up"; exit 0
            fi
            echo "waiting… ($i/36)"; sleep 5
          done
          docker compose logs backend; exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('qoe-automation-tests/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Run automation E2E tests
        id: auto_e2e
        continue-on-error: true
        run: mvn -B test -Dapi.base.url=http://localhost:8080
        working-directory: qoe-automation-tests

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-automation-surefire
          path: qoe-automation-tests/target/surefire-reports/
          retention-days: 14

      - name: Generate Allure HTML report
        if: always()
        run: mvn --no-transfer-progress allure:report -q
        working-directory: qoe-automation-tests
        continue-on-error: true

      - name: Upload Allure HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-acceptance-allure-report
          path: qoe-automation-tests/target/allure-report/
          retention-days: 14

      - name: Tear down Docker stack
        if: always()
        run: docker compose down -v || true

      - name: Post automation E2E result to Slack thread
        if: always()
        env:
          MODULE_NAME: ANDROID
          STAGE_NAME: Acceptance Tests
          JUNIT_DIR: qoe-automation-tests/target/surefire-reports
          STAGE_RESULT: ${{ steps.auto_e2e.outcome }}
          REPORT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send automation E2E Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

      - name: Fail if automation tests failed
        if: steps.auto_e2e.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4 — Final summary + Slack overall result
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4 — Quality Gate
# Passes when: tests succeed (normal mode) OR skip_tests=true (force-publish).
# ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: "Stage 4 — Quality Gate"
    runs-on: ubuntu-latest
    needs: [notify-start, build, unit-tests, automation-e2e]
    if: always() && needs.build.result == 'success'
    outputs:
      passed: ${{ steps.check.outputs.passed }}

    steps:
      - id: check
        name: Evaluate quality gate
        run: |
          SKIP="${{ inputs.skip_tests }}"
          UNIT="${{ needs.unit-tests.result }}"
          E2E="${{ needs.automation-e2e.result }}"

          if [ "$SKIP" = "true" ]; then
            echo "⚡ Force-publish mode — tests skipped, gate bypassed"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          elif [ "$UNIT" = "success" ] && [ "$E2E" = "success" ]; then
            echo "✅ Quality gate PASSED (unit=$UNIT, acceptance=$E2E)"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Quality gate FAILED (unit=$UNIT, acceptance=$E2E)"
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 5a — Publish to Firebase App Distribution — INTERNAL testers group
# Runs when quality gate passes. Internal testers receive the build for
# manual smoke testing before it reaches the public group.
# Requires: FIREBASE_APP_ID_ANDROID, FIREBASE_CREDENTIAL_FILE_CONTENT secrets.
# ─────────────────────────────────────────────────────────────────────────────
  publish-internal:
    name: "Stage 5a — Publish to Internal Testers"
    runs-on: ubuntu-latest
    needs: [notify-start, build, quality-gate]
    if: always() && needs.quality-gate.outputs.passed == 'true' && needs.build.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: ./apk

      - name: Distribute to Firebase — internal-testers
        id: firebase_internal
        if: env.FIREBASE_APP_ID_ANDROID != '' && env.FIREBASE_CREDENTIAL_FILE_CONTENT != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          groups: internal-testers
          file: apk/app-debug.apk
          releaseNotes: |
            [INTERNAL] Build #${{ github.run_number }} — ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Status: Pending public release approval — smoke test before approving.
        env:
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_CREDENTIAL_FILE_CONTENT: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}

      - name: Post internal publish result to Slack thread
        if: always()
        env:
          MODULE_NAME: ANDROID
          STAGE_NAME: "Firebase Internal Testers"
          STAGE_RESULT: ${{ steps.firebase_internal.outcome || 'skipped' }}
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send internal publish Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 5b — Publish to Firebase App Distribution — PUBLIC testers group
# Gated by the "firebase-production" GitHub Environment (requires manual
# approval from a designated reviewer in GitHub Actions UI).
# Reviewers install the build from internal-testers, smoke test it, then
# approve or reject in GitHub → Actions → this run → Review deployments.
# ─────────────────────────────────────────────────────────────────────────────
  publish-public:
    name: "Stage 5b — Publish to Public Testers"
    runs-on: ubuntu-latest
    environment: firebase-production   # ← approval gate; configure in repo Settings → Environments
    needs: [notify-start, build, quality-gate, publish-internal]
    if: always() && needs.quality-gate.outputs.passed == 'true' && needs.publish-internal.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: ./apk

      - name: Distribute to Firebase — public-testers
        id: firebase_public
        if: env.FIREBASE_APP_ID_ANDROID != '' && env.FIREBASE_CREDENTIAL_FILE_CONTENT != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          groups: public-testers
          file: apk/app-debug.apk
          releaseNotes: |
            Build #${{ github.run_number }} — ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            ✅ Approved after internal smoke testing.
        env:
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_CREDENTIAL_FILE_CONTENT: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}

      - name: Post public publish result to Slack thread
        if: always()
        env:
          MODULE_NAME: ANDROID
          STAGE_NAME: "Firebase Public Testers"
          STAGE_RESULT: ${{ steps.firebase_public.outcome || 'skipped' }}
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send public publish Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 6 — Final summary + Slack overall result
# ─────────────────────────────────────────────────────────────────────────────
  report:
    name: "Stage 6 — Report & Slack Summary"
    runs-on: ubuntu-latest
    needs: [notify-start, unit-tests, lint, build, automation-e2e, quality-gate, publish-internal, publish-public]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Pipeline summary
        run: |
          echo "## Android Player Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Debug APK | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Acceptance Tests | ${{ needs.automation-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Gate | ${{ needs.quality-gate.result }} (${{ needs.quality-gate.outputs.passed }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase Internal | ${{ needs.publish-internal.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase Public   | ${{ needs.publish-public.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`  |  **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Build Slack overall summary payload
        if: always()
        env:
          MODULE_NAME: ANDROID
          STAGE1_NAME: Unit Tests
          STAGE1_RESULT: ${{ needs.unit-tests.result }}
          STAGE2_NAME: Build Debug APK
          STAGE2_RESULT: ${{ needs.build.result }}
          STAGE3_NAME: Acceptance Tests
          STAGE3_RESULT: ${{ needs.automation-e2e.result }}
          STAGE4_NAME: Firebase Internal
          STAGE4_RESULT: ${{ needs.publish-internal.result }}
          STAGE5_NAME: Firebase Public
          STAGE5_RESULT: ${{ needs.publish-public.result }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          WORKFLOW_START_EPOCH: ${{ needs.notify-start.outputs.start_epoch }}
        run: python3 .github/scripts/module_result_to_slack.py

      - name: Inject thread_ts into summary payload
        if: always() && needs.notify-start.outputs.thread_ts != ''
        run: |
          python3 - <<'EOF'
          import json, pathlib
          ts = "${{ needs.notify-start.outputs.thread_ts }}"
          p = json.loads(pathlib.Path("module-slack-payload.json").read_text())
          p["thread_ts"] = ts
          pathlib.Path("module-slack-payload.json").write_text(json.dumps(p))
          EOF

      - name: Send overall summary Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./module-slack-payload.json

      - name: Fail pipeline if any critical stage failed
        if: |
          needs.unit-tests.result == 'failure' ||
          needs.build.result == 'failure' ||
          needs.automation-e2e.result == 'failure'
        run: exit 1
