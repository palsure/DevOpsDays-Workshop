# QoE Android Player Pipeline
#
# Stages:
#   1. unit-tests — JVM unit tests (fast, no emulator)
#   2. lint       — Android lint static analysis (parallel with unit-tests)
#   3. build      — Assemble debug APK (only runs when unit-tests pass)

name: QoE Android Player Tests

on:
  pull_request:
    paths:
      - 'android-player/**'
      - '.github/workflows/qoe-android-tests.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'android-player/**'
  workflow_dispatch:

env:
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: android-player

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — Unit Tests (JVM, no emulator required)
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  unit-tests:
    name: "Stage 1 — Unit Tests"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-android@v3
        with:
          android-sdk-version: '35'
        continue-on-error: true

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android-player/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-android-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --no-daemon

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: android-player/app/build/test-results/
          retention-days: 7

      - name: Upload unit test HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-report
          path: android-player/app/build/reports/tests/
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1b — Lint (runs in parallel with unit tests)
# ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: "Stage 1b — Lint"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android-player/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-android-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lint --no-daemon
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android-player/app/build/reports/lint-results*.html
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — Build debug APK (only when unit tests pass)
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "Stage 2 — Build Debug APK"
    runs-on: ubuntu-latest
    needs: unit-tests
    if: success()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android-player/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-android-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android-player/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — Report summary
# ─────────────────────────────────────────────────────────────────────────────
  report:
    name: "Stage 3 — Report"
    runs-on: ubuntu-latest
    needs: [unit-tests, lint, build]
    if: always()

    steps:
      - name: Pipeline summary
        run: |
          echo "## Android Player Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Debug APK | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`  |  **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Fail pipeline if unit tests or build failed
        if: |
          needs.unit-tests.result == 'failure' ||
          needs.build.result == 'failure'
        run: exit 1
