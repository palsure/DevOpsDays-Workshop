# QoE Android Player Pipeline
#
# Stages (mirrors web pipeline structure):
#   0. notify-start    — post "build started" to Slack
#   1. unit-tests      — JVM unit tests + Allure results → Slack thread reply
#   1b. lint           — Android lint (parallel with unit-tests)
#   2. build           — Assemble debug APK (only when unit-tests + lint pass)
#   3. bat-e2e         — BAT instrumented tests on emulator → Slack thread reply
#   4. smoke-e2e       — Smoke instrumented tests on emulator → Slack thread reply
#   5. regression-e2e  — Regression tests (nightly/on-demand only)
#   6. quality-gate    — Gate: unit + BAT + Smoke must all pass
#   7a. publish-internal — Firebase App Distribution (internal testers)
#   7b. publish-public   — Firebase public testers (manual approval gate)
#   8. report          — Final summary + Slack overall result

name: Stream-QoE-App-Android

on:
  pull_request:
    paths:
      - 'android-player/**'
      - '.github/workflows/qoe-android-tests.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'android-player/**'
      - '.github/workflows/qoe-android-tests.yml'
  schedule:
    # Nightly regression run at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests and force-publish to Firebase (hotfix mode)'
        required: false
        default: false
        type: boolean
      run_regression:
        description: 'Run Regression tests (in addition to BAT + Smoke)'
        required: false
        default: false
        type: boolean
      environment:
        description: 'Target environment (STAGE / PROD)'
        required: false
        default: 'STAGE'

env:
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
  JAVA_VERSION: '17'
  API_LEVEL: 34
  AVD_TARGET: default
  ARCH: x86_64

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 0 — Notify Start
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  notify-start:
    name: Notify — build started
    runs-on: ubuntu-latest
    outputs:
      thread_ts:   ${{ steps.post.outputs.thread_ts }}
      start_epoch: ${{ steps.ts.outputs.start_epoch }}

    steps:
      - name: Record start time
        id: ts
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Post "build started" to Slack
        id: post
        if: env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(python3 - <<EOF
          import json
          blocks = [
            {"type": "header", "text": {"type": "plain_text", "text": "[ANDROID] Build — Started  |  Build #${{ github.run_number }}", "emoji": True}},
            {"type": "section", "fields": [
              {"type": "mrkdwn", "text": "*Branch:*\n\`${{ github.ref_name }}\`"},
              {"type": "mrkdwn", "text": "*Commit:*\n<$COMMIT_URL|${SHORT_SHA}>"},
              {"type": "mrkdwn", "text": "*Triggered by:*\n${{ github.actor }} (${{ github.event_name }})"},
            ]},
            {"type": "divider"},
            {"type": "context", "elements": [{"type": "mrkdwn", "text": "⏳ Unit tests & lint running… BAT/Smoke results will follow in this thread."}]},
            {"type": "actions", "elements": [{"type": "button", "text": {"type": "plain_text", "text": "View Run", "emoji": True}, "url": "$RUN_URL", "style": "primary"}]}
          ]
          print(json.dumps({"channel": "${{ env.SLACK_CHANNEL_ID }}", "unfurl_links": False, "unfurl_media": False, "blocks": blocks}))
          EOF
          )

          RESPONSE=$(curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Slack response: $RESPONSE"
          TS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ts',''))")
          echo "thread_ts=$TS" >> "$GITHUB_OUTPUT"

      - name: Set empty thread_ts when Slack not configured
        if: env.SLACK_BOT_TOKEN == '' || env.SLACK_CHANNEL_ID == ''
        run: echo "thread_ts=" >> "$GITHUB_OUTPUT"

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — Unit Tests (JVM, Allure results)
# ─────────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: "Stage 1 — Unit Tests"
    runs-on: ubuntu-latest
    needs: notify-start
    if: inputs.skip_tests != true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android-player/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-android-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android-player

      - name: Run unit tests
        id: unit
        run: ./gradlew unitTest --no-daemon
        working-directory: android-player
        continue-on-error: true

      - name: Generate Allure report (unit)
        if: always()
        run: |
          allure generate app/build/allure-results/unit --clean \
            -o app/build/reports/allure-report/unit || true
        working-directory: android-player
        continue-on-error: true

      - name: Upload Allure results (unit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-allure-results
          path: android-player/app/build/allure-results/unit/
          retention-days: 7

      - name: Upload Allure HTML report (unit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-allure-report
          path: android-player/app/build/reports/allure-report/unit/
          retention-days: 14

      - name: Upload JUnit XML results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: android-player/app/build/test-results/testDebugUnitTest/
          retention-days: 7

      - name: Post unit test result to Slack thread
        if: always()
        env:
          MODULE_NAME: ANDROID
          STAGE_NAME: Unit Tests
          JUNIT_DIR: android-player/app/build/test-results/testDebugUnitTest
          STAGE_RESULT: ${{ steps.unit.outcome }}
          REPORT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send unit test Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

      - name: Fail if unit tests failed
        if: steps.unit.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1b — Lint (parallel with unit-tests)
# ─────────────────────────────────────────────────────────────────────────────
  lint:
    name: "Stage 1b — Lint"
    runs-on: ubuntu-latest
    needs: notify-start
    if: inputs.skip_tests != true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android-player/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-android-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android-player

      - name: Run lint
        run: ./gradlew lint --no-daemon
        working-directory: android-player
        continue-on-error: true

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: android-player/app/build/reports/lint-results*.html
          retention-days: 7

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — Build debug APK
# ─────────────────────────────────────────────────────────────────────────────
  build:
    name: "Stage 2 — Build Debug APK"
    runs-on: ubuntu-latest
    needs: [notify-start, unit-tests, lint]
    if: always() && needs.notify-start.result == 'success' && needs.unit-tests.result != 'failure' && needs.lint.result != 'failure'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android-player/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-android-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android-player

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android-player

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android-player/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — BAT instrumented tests (emulator)
# ─────────────────────────────────────────────────────────────────────────────
  bat-e2e:
    name: "Stage 3 — BAT (Instrumented)"
    runs-on: macos-latest
    needs: [notify-start, build]
    if: inputs.skip_tests != true && needs.build.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android-player/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-android-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android-player

      - name: Run BAT instrumented tests
        id: bat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.ARCH }}
          profile: Nexus 6
          script: |
            cd android-player
            ./gradlew connectedDebugAndroidTest \
              -PtestStage=bat \
              --no-daemon \
              2>&1 | tee bat-test.log
          disable-animations: true
        continue-on-error: true

      - name: Upload BAT test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-bat-test-results
          path: android-player/app/build/outputs/androidTest-results/connected/
          retention-days: 7

      - name: Upload BAT test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-bat-test-log
          path: android-player/bat-test.log
          retention-days: 7

      - name: Generate Allure report (BAT)
        if: always()
        run: |
          # Convert Android instrumented test XML to Allure-compatible results
          allure generate android-player/app/build/outputs/androidTest-results/connected \
            --clean -o android-player/app/build/reports/allure-report/bat || true
        continue-on-error: true

      - name: Upload Allure HTML report (BAT)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-bat-allure-report
          path: android-player/app/build/reports/allure-report/bat/
          retention-days: 14

      - name: Post BAT result to Slack thread
        if: always()
        env:
          MODULE_NAME: ANDROID
          STAGE_NAME: BAT (Instrumented)
          STAGE_RESULT: ${{ steps.bat.outcome }}
          REPORT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send BAT Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

      - name: Fail if BAT tests failed
        if: steps.bat.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 4 — Smoke instrumented tests (emulator, after BAT passes)
# ─────────────────────────────────────────────────────────────────────────────
  smoke-e2e:
    name: "Stage 4 — Smoke (Instrumented)"
    runs-on: macos-latest
    needs: [notify-start, build, bat-e2e]
    if: inputs.skip_tests != true && needs.bat-e2e.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android-player/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-android-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android-player

      - name: Run Smoke instrumented tests
        id: smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.ARCH }}
          profile: Nexus 6
          script: |
            cd android-player
            ./gradlew connectedDebugAndroidTest \
              -PtestStage=smoke \
              --no-daemon \
              2>&1 | tee smoke-test.log
          disable-animations: true
        continue-on-error: true

      - name: Upload Smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-test-results
          path: android-player/app/build/outputs/androidTest-results/connected/
          retention-days: 7

      - name: Upload Smoke test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-test-log
          path: android-player/smoke-test.log
          retention-days: 7

      - name: Generate Allure report (Smoke)
        if: always()
        run: |
          allure generate android-player/app/build/outputs/androidTest-results/connected \
            --clean -o android-player/app/build/reports/allure-report/smoke || true
        continue-on-error: true

      - name: Upload Allure HTML report (Smoke)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-smoke-allure-report
          path: android-player/app/build/reports/allure-report/smoke/
          retention-days: 14

      - name: Post Smoke result to Slack thread
        if: always()
        env:
          MODULE_NAME: ANDROID
          STAGE_NAME: Smoke (Instrumented)
          STAGE_RESULT: ${{ steps.smoke.outcome }}
          REPORT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send Smoke Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

      - name: Fail if Smoke tests failed
        if: steps.smoke.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 5 — Regression instrumented tests (nightly or manual trigger)
# ─────────────────────────────────────────────────────────────────────────────
  regression-e2e:
    name: "Stage 5 — Regression (Instrumented)"
    runs-on: macos-latest
    needs: [notify-start, build, smoke-e2e]
    # Run only on schedule (nightly) or when explicitly requested
    if: >
      inputs.skip_tests != true &&
      needs.smoke-e2e.result == 'success' &&
      (github.event_name == 'schedule' || inputs.run_regression == true)

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-android-${{ hashFiles('android-player/**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-android-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: android-player

      - name: Run Regression instrumented tests
        id: regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: ${{ env.AVD_TARGET }}
          arch: ${{ env.ARCH }}
          profile: Nexus 6
          script: |
            cd android-player
            ./gradlew connectedDebugAndroidTest \
              -PtestStage=regression \
              --no-daemon \
              2>&1 | tee regression-test.log
          disable-animations: true
        continue-on-error: true

      - name: Upload Regression test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-regression-test-results
          path: android-player/app/build/outputs/androidTest-results/connected/
          retention-days: 14

      - name: Generate Allure report (Regression)
        if: always()
        run: |
          allure generate android-player/app/build/outputs/androidTest-results/connected \
            --clean -o android-player/app/build/reports/allure-report/regression || true
        continue-on-error: true

      - name: Upload Allure HTML report (Regression)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-regression-allure-report
          path: android-player/app/build/reports/allure-report/regression/
          retention-days: 14

      - name: Post Regression result to Slack thread
        if: always()
        env:
          MODULE_NAME: ANDROID
          STAGE_NAME: Regression (Instrumented)
          STAGE_RESULT: ${{ steps.regression.outcome }}
          REPORT_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send Regression Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 6 — Quality Gate
# Passes when: unit + BAT + Smoke succeed (or skip_tests=true).
# Regression is informational only and does not block deployment.
# ─────────────────────────────────────────────────────────────────────────────
  quality-gate:
    name: "Stage 6 — Quality Gate"
    runs-on: ubuntu-latest
    needs: [notify-start, unit-tests, build, bat-e2e, smoke-e2e]
    if: always() && needs.build.result == 'success'
    outputs:
      passed: ${{ steps.check.outputs.passed }}

    steps:
      - id: check
        name: Evaluate quality gate
        run: |
          SKIP="${{ inputs.skip_tests }}"
          UNIT="${{ needs.unit-tests.result }}"
          BAT="${{ needs.bat-e2e.result }}"
          SMOKE="${{ needs.smoke-e2e.result }}"

          if [ "$SKIP" = "true" ]; then
            echo "⚡ Force-publish mode — tests skipped, gate bypassed"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          elif [ "$UNIT" = "success" ] && [ "$BAT" = "success" ] && [ "$SMOKE" = "success" ]; then
            echo "✅ Quality gate PASSED (unit=$UNIT, bat=$BAT, smoke=$SMOKE)"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "❌ Quality gate FAILED (unit=$UNIT, bat=$BAT, smoke=$SMOKE)"
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 7a — Firebase internal testers
# ─────────────────────────────────────────────────────────────────────────────
  publish-internal:
    name: "Stage 7a — Publish to Internal Testers"
    runs-on: ubuntu-latest
    needs: [notify-start, build, quality-gate]
    if: always() && needs.quality-gate.outputs.passed == 'true' && needs.build.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: ./apk

      - name: Distribute to Firebase — internal-testers
        id: firebase_internal
        if: env.FIREBASE_APP_ID_ANDROID != '' && env.FIREBASE_CREDENTIAL_FILE_CONTENT != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          groups: internal-testers
          file: apk/app-debug.apk
          releaseNotes: |
            [INTERNAL] Build #${{ github.run_number }} — ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Status: Pending public release approval — smoke test before approving.
        env:
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_CREDENTIAL_FILE_CONTENT: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}

      - name: Post internal publish result to Slack thread
        if: always()
        env:
          MODULE_NAME: ANDROID
          STAGE_NAME: "Firebase Internal Testers"
          STAGE_RESULT: ${{ steps.firebase_internal.outcome || 'skipped' }}
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send internal publish Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 7b — Firebase public testers (manual approval required)
# ─────────────────────────────────────────────────────────────────────────────
  publish-public:
    name: "Stage 7b — Publish to Public Testers"
    runs-on: ubuntu-latest
    environment: firebase-production
    needs: [notify-start, build, quality-gate, publish-internal]
    if: always() && needs.quality-gate.outputs.passed == 'true' && needs.publish-internal.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: android-debug-apk
          path: ./apk

      - name: Distribute to Firebase — public-testers
        id: firebase_public
        if: env.FIREBASE_APP_ID_ANDROID != '' && env.FIREBASE_CREDENTIAL_FILE_CONTENT != ''
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          groups: public-testers
          file: apk/app-debug.apk
          releaseNotes: |
            Build #${{ github.run_number }} — ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            ✅ Approved after internal smoke testing.
        env:
          FIREBASE_APP_ID_ANDROID: ${{ secrets.FIREBASE_APP_ID_ANDROID }}
          FIREBASE_CREDENTIAL_FILE_CONTENT: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}

      - name: Post public publish result to Slack thread
        if: always()
        env:
          MODULE_NAME: ANDROID
          STAGE_NAME: "Firebase Public Testers"
          STAGE_RESULT: ${{ steps.firebase_public.outcome || 'skipped' }}
          THREAD_TS: ${{ needs.notify-start.outputs.thread_ts }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 .github/scripts/stage_result_to_slack.py

      - name: Send public publish Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./stage-slack-payload.json

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 8 — Final summary + Slack overall result
# ─────────────────────────────────────────────────────────────────────────────
  report:
    name: "Stage 8 — Report & Slack Summary"
    runs-on: ubuntu-latest
    needs:
      - notify-start
      - unit-tests
      - lint
      - build
      - bat-e2e
      - smoke-e2e
      - regression-e2e
      - quality-gate
      - publish-internal
      - publish-public
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Pipeline summary
        run: |
          echo "## Android Player Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Debug APK | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| BAT (Instrumented) | ${{ needs.bat-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke (Instrumented) | ${{ needs.smoke-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Regression (Instrumented) | ${{ needs.regression-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Gate | ${{ needs.quality-gate.result }} (${{ needs.quality-gate.outputs.passed }}) |" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase Internal | ${{ needs.publish-internal.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Firebase Public   | ${{ needs.publish-public.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`  |  **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Build Slack overall summary payload
        if: always()
        env:
          MODULE_NAME: ANDROID
          STAGE1_NAME: Unit Tests
          STAGE1_RESULT: ${{ needs.unit-tests.result }}
          STAGE2_NAME: Build Debug APK
          STAGE2_RESULT: ${{ needs.build.result }}
          STAGE3_NAME: BAT (Instrumented)
          STAGE3_RESULT: ${{ needs.bat-e2e.result }}
          STAGE4_NAME: Smoke (Instrumented)
          STAGE4_RESULT: ${{ needs.smoke-e2e.result }}
          STAGE5_NAME: Firebase Public
          STAGE5_RESULT: ${{ needs.publish-public.result }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          WORKFLOW_START_EPOCH: ${{ needs.notify-start.outputs.start_epoch }}
        run: python3 .github/scripts/module_result_to_slack.py

      - name: Inject thread_ts into summary payload
        if: always() && needs.notify-start.outputs.thread_ts != ''
        run: |
          python3 - <<'EOF'
          import json, pathlib
          ts = "${{ needs.notify-start.outputs.thread_ts }}"
          p = json.loads(pathlib.Path("module-slack-payload.json").read_text())
          p["thread_ts"] = ts
          pathlib.Path("module-slack-payload.json").write_text(json.dumps(p))
          EOF

      - name: Send overall summary Slack reply
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v2.1.1
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload-file-path: ./module-slack-payload.json

      - name: Fail pipeline if any critical stage failed
        if: |
          needs.unit-tests.result == 'failure' ||
          needs.build.result == 'failure' ||
          needs.bat-e2e.result == 'failure' ||
          needs.smoke-e2e.result == 'failure'
        run: exit 1
