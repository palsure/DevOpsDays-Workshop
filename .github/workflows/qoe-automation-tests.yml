# QoE Automation Tests Pipeline
#
# Stages:
#   0. notify-start    — post "build started" to Slack; capture thread ts
#   1. unit-compile    — compile & validate test code (no external deps)
#   2. integration     — full Maven test run against live backend (Docker Compose)
#   3. report          — Summary + Slack notification

name: QoE Automation Tests

on:
  pull_request:
    paths:
      - 'qoe-automation-tests/**'
      - '.github/workflows/qoe-automation-tests.yml'
  push:
    branches: [ main, develop ]
    paths:
      - 'qoe-automation-tests/**'
      - '.github/workflows/qoe-automation-tests.yml'
  workflow_dispatch:

env:
  SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
  SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 0 — Notify Start
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  notify-start:
    name: Notify — build started
    runs-on: ubuntu-latest
    outputs:
      thread_ts:   ${{ steps.post.outputs.thread_ts }}
      start_epoch: ${{ steps.ts.outputs.start_epoch }}

    steps:
      - name: Record start time
        id: ts
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Post "build started" to Slack
        id: post
        if: env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        run: |
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          COMMIT_URL="https://github.com/${{ github.repository }}/commit/${{ github.sha }}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          PAYLOAD=$(python3 - <<EOF
          import json
          blocks = [
            {"type": "header", "text": {"type": "plain_text", "text": "[Automation] Build — Started  |  Build #${{ github.run_number }}", "emoji": True}},
            {"type": "section", "fields": [
              {"type": "mrkdwn", "text": "*Branch:*\n\`${{ github.ref_name }}\`"},
              {"type": "mrkdwn", "text": "*Commit:*\n<$COMMIT_URL|${SHORT_SHA}>"},
              {"type": "mrkdwn", "text": "*Triggered by:*\n${{ github.actor }} (${{ github.event_name }})"},
            ]},
            {"type": "divider"},
            {"type": "context", "elements": [{"type": "mrkdwn", "text": "⏳ Compiling tests… Integration results will follow in this thread."}]},
            {"type": "actions", "elements": [{"type": "button", "text": {"type": "plain_text", "text": "View Run", "emoji": True}, "url": "$RUN_URL", "style": "primary"}]}
          ]
          print(json.dumps({"channel": "${{ env.SLACK_CHANNEL_ID }}", "unfurl_links": False, "unfurl_media": False, "blocks": blocks}))
          EOF
          )

          RESPONSE=$(curl -sf -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${{ env.SLACK_BOT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          echo "Slack response: $RESPONSE"
          TS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ts',''))")
          echo "thread_ts=$TS" >> "$GITHUB_OUTPUT"

      - name: Set empty thread_ts when Slack not configured
        if: env.SLACK_BOT_TOKEN == '' || env.SLACK_CHANNEL_ID == ''
        run: echo "thread_ts=" >> "$GITHUB_OUTPUT"

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 1 — Compile & validate (no external services needed)
# ─────────────────────────────────────────────────────────────────────────────
  unit-compile:
    name: "Stage 1 — Compile & Validate"
    runs-on: ubuntu-latest
    needs: notify-start

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('qoe-automation-tests/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Compile test code (validate, no tests run)
        run: mvn -B test-compile -DskipTests
        working-directory: qoe-automation-tests

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 2 — Integration tests (requires backend + Postgres via Docker Compose)
#           Only runs when Stage 1 passes
# ─────────────────────────────────────────────────────────────────────────────
  integration:
    name: "Stage 2 — Integration Tests"
    runs-on: ubuntu-latest
    needs: unit-compile
    if: success()

    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres + API backend (Docker Compose)
        run: docker compose up -d postgres backend

      - name: Wait for backend health
        run: |
          for i in $(seq 1 36); do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "backend is up"
              exit 0
            fi
            echo "waiting… ($i/36)"
            sleep 5
          done
          docker compose logs backend
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/cache@v3
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('qoe-automation-tests/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-

      - name: Run integration tests
        id: mvn_tests
        continue-on-error: true
        run: mvn -B test -Dapi.base.url=http://localhost:8080
        working-directory: qoe-automation-tests

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automation-surefire-reports
          path: qoe-automation-tests/target/surefire-reports/
          retention-days: 14

      - name: Tear down Docker services
        if: always()
        run: docker compose down -v || true

      - name: Fail if tests failed
        if: steps.mvn_tests.outcome == 'failure'
        run: exit 1

# ─────────────────────────────────────────────────────────────────────────────
# STAGE 3 — Report + Slack notification
# ─────────────────────────────────────────────────────────────────────────────
  report:
    name: "Stage 3 — Report & Slack"
    runs-on: ubuntu-latest
    needs: [notify-start, unit-compile, integration]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Pipeline summary
        run: |
          echo "## QoE Automation Tests Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Compile & Validate | ${{ needs.unit-compile.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`  |  **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Build Slack result payload
        if: always()
        env:
          MODULE_NAME: Automation
          STAGE1_NAME: Compile & Validate
          STAGE1_RESULT: ${{ needs.unit-compile.result }}
          STAGE2_NAME: Integration Tests
          STAGE2_RESULT: ${{ needs.integration.result }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          WORKFLOW_START_EPOCH: ${{ needs.notify-start.outputs.start_epoch }}
        run: python3 .github/scripts/module_result_to_slack.py

      - name: Inject thread_ts into Slack payload
        if: always() && needs.notify-start.outputs.thread_ts != ''
        run: |
          python3 - <<'EOF'
          import json, pathlib
          ts = "${{ needs.notify-start.outputs.thread_ts }}"
          p = json.loads(pathlib.Path("module-slack-payload.json").read_text())
          p["thread_ts"] = ts
          pathlib.Path("module-slack-payload.json").write_text(json.dumps(p))
          EOF

      - name: Send Slack result notification
        if: always() && env.SLACK_BOT_TOKEN != '' && env.SLACK_CHANNEL_ID != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          payload-file-path: ./module-slack-payload.json
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

      - name: Fail pipeline if any stage failed
        if: |
          needs.unit-compile.result == 'failure' ||
          needs.integration.result == 'failure'
        run: exit 1
