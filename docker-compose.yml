version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: qoe-postgres
    environment:
      POSTGRES_USER: qoe_user
      POSTGRES_PASSWORD: qoe_password
      POSTGRES_DB: qoe_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend-api/src/main/resources/db/migration:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qoe_user -d qoe_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      # Repo root context so the Dockerfile can COPY the shared
      # ops/monitoring/newrelic/newrelic.yml into the runtime image.
      context: .
      dockerfile: backend-api/Dockerfile
    container_name: qoe-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qoe_db
      SPRING_DATASOURCE_USERNAME: qoe_user
      SPRING_DATASOURCE_PASSWORD: qoe_password
      # New Relic Java APM — opt-in. Set NEWRELIC_ENABLED=true and supply a
      # license key to attach the agent at startup (see backend-api/docker-entrypoint.sh).
      NEWRELIC_ENABLED:     ${NEWRELIC_ENABLED:-false}
      NEWRELIC_LICENSE_KEY: ${NEWRELIC_LICENSE_KEY:-}
      NEWRELIC_APP_NAME:    ${NEWRELIC_APP_NAME:-QoE API}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web-player:
    build:
      context: .
      dockerfile: web-player/Dockerfile
      # Vite inlines VITE_* env vars at build time, so they must be passed as
      # build args (not runtime env). Anything blank => the NR Browser agent
      # stays disabled at runtime (see web-player/src/services/newrelic.ts).
      args:
        VITE_NEWRELIC_LICENSE_KEY:    ${VITE_NEWRELIC_LICENSE_KEY:-}
        VITE_NEWRELIC_APPLICATION_ID: ${VITE_NEWRELIC_APPLICATION_ID:-}
        VITE_NEWRELIC_ACCOUNT_ID:     ${VITE_NEWRELIC_ACCOUNT_ID:-}
        VITE_NEWRELIC_TRUST_KEY:      ${VITE_NEWRELIC_TRUST_KEY:-}
        VITE_NEWRELIC_AGENT_ID:       ${VITE_NEWRELIC_AGENT_ID:-}
    container_name: qoe-web-player
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: qoe-nginx
    ports:
      - "8081:80"
    volumes:
      - ./ops/infrastructure/server/nginx.conf:/etc/nginx/nginx.conf
      - ./ops/infrastructure/test-content:/usr/share/nginx/html/videos
    depends_on:
      - web-player

  # ─────────────────────────────────────────────────────────────────
  # Dockerized Playwright runner. Skipped by default — only starts when
  # the `e2e` profile is active. Bring it up with:
  #
  #   docker compose --profile e2e run --rm e2e
  #
  # Override the suite by exporting PLAYWRIGHT_GREP=@Smoke (or any
  # tag/title regex). Reports land in web-player/playwright-report and
  # web-player/allure-results because the host directory is mounted in.
  # ─────────────────────────────────────────────────────────────────
  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: web-player/Dockerfile.e2e
    container_name: qoe-e2e
    depends_on:
      web-player:
        condition: service_started
      backend:
        condition: service_healthy
    environment:
      PLAYWRIGHT_BASE_URL: http://web-player:3000
      PLAYWRIGHT_STAGE:    ${PLAYWRIGHT_STAGE:-bat}
      PLAYWRIGHT_GREP:     ${PLAYWRIGHT_GREP:-@BAT}
      CI: "true"
    volumes:
      # Mount the report and Allure-results dirs back to the host so
      # the user can serve them with `npx playwright show-report` or
      # `allure serve` after the container exits.
      - ./web-player/playwright-report:/workspace/web-player/playwright-report
      - ./web-player/allure-results:/workspace/web-player/allure-results
      - ./web-player/test-results:/workspace/web-player/test-results

volumes:
  postgres_data:
